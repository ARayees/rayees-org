<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e8ddca">
  <title>Abdullah Rayees</title>

  <style>
    :root {
      --champagne: #e8ddca;
      --champagne-light: #f6f2ea;
      --navy: #07192b;
      --midnight: #102c46;
      --gold: #b89558;
      --pale-gold: #d8c39a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--champagne-light);
      color: var(--navy);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================================================
       BACKGROUND
    ========================================================= */

    .world {
      position: fixed;
      inset: 0;
      z-index: -20;
      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          #f6f2ea 0%,
          #e8ddca 55%,
          #ddd0b9 100%
        );

      transition: background .1s linear;
    }

    .navy-layer {
      position: absolute;
      inset: -5%;

      opacity: 0;

      background:
        radial-gradient(
          circle at 25% 20%,
          #163956 0%,
          #0c263d 32%,
          #07192b 72%
        );

      will-change: opacity;
    }

    /* =========================================================
       AMBIENT COLOR
    ========================================================= */

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      will-change: transform, opacity;
    }

    .glow-blue {
      width: 700px;
      height: 600px;

      left: -300px;
      top: -160px;

      background: rgba(44, 91, 130, .32);

      animation:
        driftBlue
        20s
        ease-in-out
        infinite alternate;
    }

    .glow-gold {
      width: 650px;
      height: 500px;

      right: -260px;
      top: 30%;

      background: rgba(184, 149, 88, .25);

      animation:
        driftGold
        25s
        ease-in-out
        infinite alternate;
    }

    .glow-champagne {
      width: 650px;
      height: 500px;

      left: 30%;
      bottom: -260px;

      background: rgba(216, 195, 154, .25);

      animation:
        driftChampagne
        28s
        ease-in-out
        infinite alternate;
    }

    /* =========================================================
       ABSTRACT LUXURY FORMS
    ========================================================= */

    .form {
      position: absolute;

      border:
        1px solid
        rgba(255,255,255,.24);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.15),
          rgba(255,255,255,.015)
        );

      box-shadow:
        inset 35px 30px 80px
        rgba(255,255,255,.12),

        inset -30px -40px 100px
        rgba(7,25,43,.12);

      backdrop-filter:
        blur(22px)
        saturate(125%);

      -webkit-backdrop-filter:
        blur(22px)
        saturate(125%);

      will-change:
        transform,
        border-radius;
    }

    .form-one {
      width: 650px;
      height: 650px;

      left: -300px;
      top: 18%;

      border-radius:
        58% 42% 62% 38% /
        45% 61% 39% 55%;

      animation:
        morphOne
        22s
        ease-in-out
        infinite alternate;
    }

    .form-two {
      width: 780px;
      height: 780px;

      right: -390px;
      top: 43%;

      border-radius:
        39% 61% 46% 54% /
        62% 38% 60% 40%;

      animation:
        morphTwo
        27s
        ease-in-out
        infinite alternate;
    }

    /* =========================================================
       GOLD REFLECTION
    ========================================================= */

    .gold-line {
      position: absolute;

      width: 1200px;
      height: 2px;

      left: 50%;
      top: 50%;

      opacity: 0;

      transform:
        translateX(-50%)
        rotate(-11deg);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(184,149,88,0),
          rgba(216,195,154,.9),
          rgba(184,149,88,.55),
          transparent
        );

      box-shadow:
        0 0 30px
        rgba(216,195,154,.4);

      will-change:
        transform,
        opacity;
    }

    .gold-haze {
      position: absolute;

      width: 1100px;
      height: 140px;

      left: 50%;
      top: 48%;

      opacity: 0;

      transform:
        translateX(-50%)
        rotate(-11deg);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(216,195,154,.12),
          transparent
        );

      filter:
        blur(35px);
    }

    /* =========================================================
       GRAIN
    ========================================================= */

    .grain {
      position: absolute;
      inset: 0;

      opacity: .06;

      pointer-events: none;

      background-image:
        radial-gradient(
          rgba(20,20,22,.22)
          .45px,
          transparent .55px
        );

      background-size:
        5px 5px;
    }

    /* =========================================================
       SCROLL STORY
    ========================================================= */

    .story {
      position: relative;
      height: 330vh;
    }

    .stage {
      position: sticky;
      top: 0;

      height: 100vh;
      min-height: 560px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      padding:
        30px
        24px
        90px;
    }

    /* =========================================================
       TYPOGRAPHY
    ========================================================= */

    .name {
      position: relative;
      z-index: 10;

      width: 100%;

      text-align: center;

      will-change:
        transform;
    }

    h1 {
      margin: 0;

      padding:
        .12em
        .16em
        .23em;

      font-family:
        "Iowan Old Style",
        "Baskerville",
        "Baskerville Old Face",
        "Times New Roman",
        serif;

      font-size:
        clamp(
          72px,
          11vw,
          158px
        );

      line-height: .98;

      font-weight: 400;

      letter-spacing:
        -.055em;
    }

    h1 span {
      display: block;

      will-change:
        transform,
        opacity,
        filter,
        color;
    }

    .first-name {
      opacity: .03;

      filter:
        blur(20px);

      transform:
        translateY(55px);

      color:
        var(--navy);
    }

    .last-name {
      opacity: 0;

      filter:
        blur(24px);

      transform:
        translateY(85px);

      color:
        var(--navy);
    }

    /* =========================================================
       FLOATING SOCIALS
    ========================================================= */

    .socials {
      position: fixed;

      z-index: 100;

      left: 50%;
      bottom: 26px;

      display: flex;

      gap: 13px;

      transform:
        translateX(-50%)
        translateY(30px);

      opacity: 0;

      pointer-events: none;

      transition:
        opacity .8s
        cubic-bezier(.16,1,.3,1),

        transform .8s
        cubic-bezier(.16,1,.3,1);
    }

    .socials.visible {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);

      pointer-events: auto;
    }

    .social {
      width: 49px;
      height: 49px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      color: var(--navy);

      text-decoration: none;

      border:
        1px solid
        rgba(255,255,255,.48);

      background:
        rgba(246,242,234,.38);

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.7),

        0 12px 35px
        rgba(0,0,0,.09);

      backdrop-filter:
        blur(22px)
        saturate(130%);

      -webkit-backdrop-filter:
        blur(22px)
        saturate(130%);

      transition:
        color .5s ease,
        background .5s ease,
        border .5s ease;
    }

    .social svg {
      width: 20px;
      height: 20px;

      fill: currentColor;
    }

    .instagram {
      animation:
        socialOne
        6.4s
        ease-in-out
        infinite alternate;
    }

    .linkedin {
      animation:
        socialTwo
        7.3s
        ease-in-out
        infinite alternate;
    }

    .social.dark {
      color:
        var(--champagne-light);

      background:
        rgba(255,255,255,.08);

      border-color:
        rgba(216,195,154,.25);
    }

    @media
    (hover:hover)
    and
    (pointer:fine) {

      .social:hover {
        background:
          rgba(216,195,154,.30);
      }

    }

    /* =========================================================
       AMBIENT ANIMATIONS
    ========================================================= */

    @keyframes driftBlue {

      from {
        transform:
          translate(0,0)
          scale(1);
      }

      to {
        transform:
          translate(220px,160px)
          scale(1.15,.88);
      }

    }

    @keyframes driftGold {

      from {
        transform:
          translate(0,0);
      }

      to {
        transform:
          translate(-200px,120px)
          scale(.9,1.15);
      }

    }

    @keyframes driftChampagne {

      from {
        transform:
          translate(0,0);
      }

      to {
        transform:
          translate(100px,-170px)
          scale(1.15,.9);
      }

    }

    @keyframes morphOne {

      0% {
        transform:
          translate(0,0)
          rotate(-7deg)
          scale(1);

        border-radius:
          58% 42% 62% 38% /
          45% 61% 39% 55%;
      }

      100% {
        transform:
          translate(210px,120px)
          rotate(21deg)
          scale(1.15,.88);

        border-radius:
          40% 60% 47% 53% /
          62% 38% 58% 42%;
      }

    }

    @keyframes morphTwo {

      0% {
        transform:
          translate(0,0)
          rotate(7deg);
      }

      100% {
        transform:
          translate(-220px,-100px)
          rotate(-19deg)
          scale(.9,1.12);

        border-radius:
          62% 38% 57% 43% /
          42% 61% 39% 58%;
      }

    }

    @keyframes socialOne {

      from {
        transform:
          translateY(3px)
          rotate(-1deg);
      }

      to {
        transform:
          translateY(-5px)
          rotate(.8deg);
      }

    }

    @keyframes socialTwo {

      from {
        transform:
          translateY(-4px)
          rotate(.7deg);
      }

      to {
        transform:
          translateY(4px)
          rotate(-.8deg);
      }

    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      .story {
        height:
          285vh;
      }

      .stage {
        padding:
          20px
          12px
          90px;
      }

      h1 {
        font-size:
          clamp(
            58px,
            19vw,
            94px
          );

        line-height:
          1;

        letter-spacing:
          -.05em;
      }

      .form-one {
        width:
          420px;

        height:
          420px;

        left:
          -290px;
      }

      .form-two {
        width:
          520px;

        height:
          520px;

        right:
          -360px;
      }

      .glow-blue {
        width:
          500px;

        height:
          450px;

        left:
          -330px;
      }

      .glow-gold {
        width:
          500px;

        height:
          420px;

        right:
          -340px;
      }

      .glow-champagne {
        width:
          480px;

        height:
          400px;
      }

      .socials {
        bottom:
          max(
            18px,
            env(safe-area-inset-bottom)
          );
      }

      .social {
        width:
          48px;

        height:
          48px;
      }

      .gold-line {
        width:
          700px;
      }

      .gold-haze {
        width:
          700px;
      }

    }

    @media (max-width: 380px) {

      h1 {
        font-size:
          clamp(
            52px,
            18vw,
            72px
          );
      }

    }

    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media
    (prefers-reduced-motion: reduce) {

      .glow,
      .form,
      .social {
        animation:
          none !important;
      }

      .first-name,
      .last-name {
        opacity:
          1 !important;

        filter:
          none !important;

        transform:
          none !important;
      }

    }

  </style>
</head>

<body>

  <!-- BACKGROUND -->

  <div class="world">

    <div
      class="navy-layer"
      id="navyLayer"
    ></div>

    <div
      class="glow glow-blue"
      id="blueGlow"
    ></div>

    <div
      class="glow glow-gold"
      id="goldGlow"
    ></div>

    <div
      class="glow glow-champagne"
      id="champagneGlow"
    ></div>

    <div
      class="form form-one"
      id="formOne"
    ></div>

    <div
      class="form form-two"
      id="formTwo"
    ></div>

    <div
      class="gold-haze"
      id="goldHaze"
    ></div>

    <div
      class="gold-line"
      id="goldLine"
    ></div>

    <div class="grain"></div>

  </div>


  <!-- MAIN -->

  <section
    class="story"
    id="story"
  >

    <div class="stage">

      <div
        class="name"
        id="name"
      >

        <h1>

          <span
            class="first-name"
            id="firstName"
          >
            Abdullah
          </span>

          <span
            class="last-name"
            id="lastName"
          >
            Rayees.
          </span>

        </h1>

      </div>

    </div>

  </section>


  <!-- SOCIALS -->

  <div
    class="socials"
    id="socials"
    aria-label="Social profiles"
  >

    <a
      class="social instagram"
      id="instagram"
      href="https://www.instagram.com/aaabdxllah/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M7.75 2h8.5A5.76 5.76 0 0 1 22 7.75v8.5A5.76 5.76 0 0 1 16.25 22h-8.5A5.76 5.76 0 0 1 2 16.25v-8.5A5.76 5.76 0 0 1 7.75 2Zm0 2A3.75 3.75 0 0 0 4 7.75v8.5A3.75 3.75 0 0 0 7.75 20h8.5A3.75 3.75 0 0 0 20 16.25v-8.5A3.75 3.75 0 0 0 16.25 4h-8.5ZM17.5 5.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"
        />
      </svg>

    </a>

    <a
      class="social linkedin"
      id="linkedin"
      href="https://www.linkedin.com/in/arayees/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="LinkedIn"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M5.34 3.5A2.34 2.34 0 1 1 5.34 8.18 2.34 2.34 0 0 1 5.34 3.5ZM3.32 9.75h4.04V21H3.32V9.75Zm6.55 0h3.87v1.54h.05c.54-1.02 1.86-2.1 3.83-2.1 4.1 0 4.86 2.7 4.86 6.21V21h-4.03v-4.96c0-1.18-.02-2.71-1.65-2.71-1.66 0-1.91 1.29-1.91 2.62V21h-4.02V9.75Z"
        />
      </svg>

    </a>

  </div>


  <script>

    const story =
      document.getElementById("story");

    const name =
      document.getElementById("name");

    const firstName =
      document.getElementById("firstName");

    const lastName =
      document.getElementById("lastName");

    const socials =
      document.getElementById("socials");

    const instagram =
      document.getElementById("instagram");

    const linkedin =
      document.getElementById("linkedin");

    const navyLayer =
      document.getElementById("navyLayer");

    const blueGlow =
      document.getElementById("blueGlow");

    const goldGlow =
      document.getElementById("goldGlow");

    const champagneGlow =
      document.getElementById("champagneGlow");

    const formOne =
      document.getElementById("formOne");

    const formTwo =
      document.getElementById("formTwo");

    const goldLine =
      document.getElementById("goldLine");

    const goldHaze =
      document.getElementById("goldHaze");


    function clamp(
      value,
      min,
      max
    ) {

      return Math.min(
        Math.max(value, min),
        max
      );

    }


    function ease(t) {

      return (
        1 -
        Math.pow(
          1 - t,
          3
        )
      );

    }


    function update() {

      const rect =
        story.getBoundingClientRect();


      const distance =
        story.offsetHeight -
        window.innerHeight;


      const progress =
        clamp(
          -rect.top / distance,
          0,
          1
        );


      /* ====================================
         ABDULLAH REVEAL
      ==================================== */

      const first =
        ease(

          clamp(
            progress / .26,
            0,
            1
          )

        );


      firstName.style.opacity =
        .03 +
        (.97 * first);


      firstName.style.filter =
        `
          blur(
            ${20 * (1 - first)}px
          )
        `;


      firstName.style.transform =
        `
          translateY(
            ${55 * (1 - first)}px
          )
        `;



      /* ====================================
         RAYEES REVEAL
      ==================================== */

      const last =
        ease(

          clamp(
            (progress - .08) / .28,
            0,
            1
          )

        );


      lastName.style.opacity =
        last;


      lastName.style.filter =
        `
          blur(
            ${24 * (1 - last)}px
          )
        `;


      lastName.style.transform =
        `
          translateY(
            ${85 * (1 - last)}px
          )
        `;



      /* ====================================
         TYPOGRAPHY SEPARATION

         Very restrained.
      ==================================== */

      const separate =
        ease(

          clamp(
            (progress - .34) / .32,
            0,
            1
          )

        );


      firstName.style.translate =
        `
          ${-22 * separate}px
          0
        `;


      lastName.style.translate =
        `
          ${22 * separate}px
          0
        `;



      /* ====================================
         DARK TRANSITION
      ==================================== */

      const dark =
        ease(

          clamp(
            (progress - .38) / .34,
            0,
            1
          )

        );


      navyLayer.style.opacity =
        dark;


      /*
       Text transitions from navy
       to champagne.
      */

      const lightness =
        Math.round(
          23 +
          (220 * dark)
        );


      firstName.style.color =
        `
          rgb(
            ${lightness},
            ${lightness},
            ${Math.min(
              255,
              lightness + 4
            )}
          )
        `;


      lastName.style.color =
        `
          rgb(
            ${lightness},
            ${lightness},
            ${Math.min(
              255,
              lightness + 4
            )}
          )
        `;



      /* ====================================
         GOLD REFLECTION
      ==================================== */

      const reflection =
        1 -
        Math.abs(
          progress - .66
        ) / .18;


      const reflectionOpacity =
        clamp(
          reflection,
          0,
          1
        );


      goldLine.style.opacity =
        reflectionOpacity * .8;


      goldHaze.style.opacity =
        reflectionOpacity * .65;


      goldLine.style.transform =
        `
          translateX(
            ${-65 + progress * 30}%
          )

          rotate(-11deg)
        `;


      goldHaze.style.transform =
        `
          translateX(
            ${-65 + progress * 30}%
          )

          rotate(-11deg)
        `;



      /* ====================================
         NAME SETTLE

         No giant zoom.
      ==================================== */

      const settle =
        ease(

          clamp(
            (progress - .65) / .35,
            0,
            1
          )

        );


      name.style.transform =
        `
          translateY(
            ${-12 * settle}px
          )

          scale(
            ${1 + (.025 * settle)}
          )
        `;



      /* ====================================
         SOCIAL REVEAL
      ==================================== */

      if (progress > .70) {

        socials.classList.add(
          "visible"
        );

      }

      else {

        socials.classList.remove(
          "visible"
        );

      }


      if (dark > .55) {

        instagram.classList.add(
          "dark"
        );

        linkedin.classList.add(
          "dark"
        );

      }

      else {

        instagram.classList.remove(
          "dark"
        );

        linkedin.classList.remove(
          "dark"
        );

      }



      /* ====================================
         SCROLL PARALLAX
      ==================================== */

      blueGlow.style.translate =
        `
          ${progress * 100}px
          ${progress * 70}px
        `;


      goldGlow.style.translate =
        `
          ${progress * -120}px
          ${progress * 50}px
        `;


      champagneGlow.style.translate =
        `
          ${progress * 50}px
          ${progress * -100}px
        `;


      formOne.style.translate =
        `
          ${progress * 85}px
          ${progress * -55}px
        `;


      formTwo.style.translate =
        `
          ${progress * -95}px
          ${progress * -70}px
        `;

    }


    window.addEventListener(
      "scroll",
      update,
      {
        passive: true
      }
    );


    window.addEventListener(
      "resize",
      update
    );


    update();

  </script>

</body>
</html>
