<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#eee6d8">

  <title>Abdullah Rayees</title>

  <style>
    :root {
      --ivory: #f8f5ef;
      --champagne: #eee4d2;
      --navy: #07192b;
      --navy-soft: #12344f;
      --gold: #b89558;
      --gold-light: #ddc89f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    html {
      background: var(--champagne);
      -webkit-text-size-adjust: 100%;
    }

    body {
      overflow-x: hidden;

      color: var(--navy);
      background: var(--champagne);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      overscroll-behavior-x: none;
    }

    a {
      -webkit-tap-highlight-color: transparent;
    }


    /* =========================================================
       ATMOSPHERE
    ========================================================= */

    .world {
      position: fixed;
      inset: 0;

      z-index: 0;

      overflow: hidden;
      pointer-events: none;

      background:
        linear-gradient(
          145deg,
          #faf7f1 0%,
          #eee5d6 46%,
          #dfd0b8 100%
        );

      transform: translateZ(0);
    }


    /* =========================================================
       DIFFUSED LIGHT SOURCES

       These are intentionally enormous.
       Their edges should never read as visible objects.
    ========================================================= */

    .light {
      position: absolute;

      border-radius: 50%;

      opacity: .78;

      will-change: transform;
    }


    /* =========================================================
       STRONGER NAVY OPENING
    ========================================================= */

    .navy-light {
      width: 110vw;
      height: 95vw;

      min-width: 950px;
      min-height: 800px;

      left: -52vw;
      top: -40vw;

      background:
        radial-gradient(
          ellipse at center,

          rgba(5,25,45,.68) 0%,

          rgba(13,48,77,.42) 24%,

          rgba(32,82,116,.20) 46%,

          rgba(46,96,130,.07) 60%,

          transparent 76%
        );

      filter: blur(58px);

      animation:
        navyDrift
        25s
        ease-in-out
        infinite alternate;
    }


    /* =========================================================
       STEEL BLUE REFLECTION
    ========================================================= */

    .blue-light {
      width: 95vw;
      height: 85vw;

      min-width: 800px;
      min-height: 700px;

      right: -52vw;
      top: -18vw;

      background:
        radial-gradient(
          ellipse at center,

          rgba(64,117,156,.34),

          rgba(78,128,164,.16) 40%,

          rgba(105,148,176,.05) 58%,

          transparent 74%
        );

      filter: blur(72px);

      animation:
        blueDrift
        30s
        ease-in-out
        infinite alternate;
    }


    /* =========================================================
       CHAMPAGNE LIGHT
    ========================================================= */

    .champagne-light {
      width: 105vw;
      height: 80vw;

      min-width: 900px;
      min-height: 700px;

      left: 0;
      bottom: -55vw;

      background:
        radial-gradient(
          ellipse at center,

          rgba(232,211,172,.58),

          rgba(211,181,127,.22) 38%,

          transparent 72%
        );

      filter: blur(65px);

      animation:
        champagneDrift
        32s
        ease-in-out
        infinite alternate;
    }


    /* =========================================================
       GOLD ILLUMINATION
    ========================================================= */

    .gold-light {
      width: 75vw;
      height: 60vw;

      min-width: 650px;
      min-height: 520px;

      right: -40vw;
      bottom: -18vw;

      background:
        radial-gradient(
          ellipse at center,

          rgba(181,137,70,.30),

          rgba(199,163,101,.11) 40%,

          transparent 72%
        );

      filter: blur(80px);

      animation:
        goldDrift
        27s
        ease-in-out
        infinite alternate;
    }


    /* =========================================================
       FROSTED GLASS VEIL

       All color sits behind this layer.
    ========================================================= */

    .glass-veil {
      position: absolute;
      inset: 0;

      z-index: 4;

      background:
        linear-gradient(
          135deg,

          rgba(255,255,255,.35),

          rgba(255,255,255,.19) 35%,

          rgba(246,242,234,.25) 65%,

          rgba(255,255,255,.33)
        );

      -webkit-backdrop-filter:
        blur(36px)
        saturate(118%);

      backdrop-filter:
        blur(36px)
        saturate(118%);

      box-shadow:
        inset 0 0 160px
        rgba(255,255,255,.18);

      pointer-events: none;
    }


    /* =========================================================
       PEARL SHEEN
    ========================================================= */

    .glass-sheen {
      position: absolute;
      inset: 0;

      z-index: 5;

      opacity: .32;

      background:
        linear-gradient(
          115deg,

          rgba(255,255,255,.18) 0%,

          transparent 28%,

          rgba(218,200,164,.08) 50%,

          transparent 70%,

          rgba(255,255,255,.12) 100%
        );

      pointer-events: none;
    }


    /* =========================================================
       MIDNIGHT WORLD
    ========================================================= */

    .midnight {
      position: absolute;
      inset: 0;

      z-index: 6;

      opacity: 0;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,

          #123957 0%,

          #0a2943 34%,

          #071d32 65%,

          #051524 100%
        );

      will-change: opacity;
    }


    /* =========================================================
       MIDNIGHT BLUE ILLUMINATION
    ========================================================= */

    .midnight::before {
      content: "";

      position: absolute;

      width: 95vw;
      height: 80vw;

      left: -52vw;
      top: -38vw;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse,

          rgba(66,126,166,.32),

          rgba(32,79,112,.13) 42%,

          transparent 72%
        );

      filter: blur(65px);

      animation:
        midnightBlue
        27s
        ease-in-out
        infinite alternate;
    }


    /* =========================================================
       STRONGER CHAMPAGNE ENDING
    ========================================================= */

    .midnight::after {
      content: "";

      position: absolute;

      width: 95vw;
      height: 80vw;

      right: -45vw;
      bottom: -42vw;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse,

          rgba(238,220,184,.38) 0%,

          rgba(216,195,154,.24) 25%,

          rgba(193,153,86,.10) 48%,

          transparent 74%
        );

      filter: blur(72px);

      animation:
        midnightGold
        31s
        ease-in-out
        infinite alternate;
    }


    /* =========================================================
       FROSTED MIDNIGHT GLASS
    ========================================================= */

    .midnight-glass {
      position: absolute;
      inset: 0;

      z-index: 7;

      opacity: 0;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.018),
          rgba(6,24,42,.07),
          rgba(221,200,159,.015)
        );

      -webkit-backdrop-filter:
        blur(27px)
        saturate(118%);

      backdrop-filter:
        blur(27px)
        saturate(118%);

      pointer-events: none;

      will-change: opacity;
    }


    /* =========================================================
       GOLD REFLECTION
    ========================================================= */

    .gold-sweep {
      position: absolute;

      z-index: 8;

      width: 190%;
      height: 150px;

      left: -45%;
      top: 49%;

      opacity: 0;

      background:
        linear-gradient(
          90deg,

          transparent 25%,

          rgba(221,200,159,0) 36%,

          rgba(221,200,159,.09) 44%,

          rgba(221,200,159,.38) 50%,

          rgba(184,149,88,.12) 57%,

          transparent 70%
        );

      filter: blur(28px);

      transform:
        rotate(-9deg)
        translate3d(-20%,0,0);

      will-change:
        opacity,
        transform;
    }


    .gold-line {
      position: absolute;

      z-index: 9;

      width: 190%;
      height: 1px;

      left: -45%;
      top: 50%;

      opacity: 0;

      background:
        linear-gradient(
          90deg,

          transparent,

          rgba(221,200,159,.10),

          rgba(235,214,174,.92),

          rgba(184,149,88,.28),

          transparent
        );

      box-shadow:
        0 0 30px
        rgba(221,200,159,.30);

      transform:
        rotate(-9deg)
        translate3d(-20%,0,0);

      will-change:
        opacity,
        transform;
    }


    /* =========================================================
       GRAIN
    ========================================================= */

    .grain {
      position: absolute;
      inset: 0;

      z-index: 10;

      opacity: .035;

      background-image:
        radial-gradient(
          rgba(20,20,22,.30)
          .4px,
          transparent .5px
        );

      background-size:
        5px 5px;

      pointer-events: none;
    }


    /* =========================================================
       SCROLL EXPERIENCE
    ========================================================= */

    .experience {
      position: relative;

      z-index: 20;

      height: 320vh;
      height: 320svh;
    }


    .stage {
      position: sticky;
      top: 0;

      width: 100%;

      height: 100vh;
      height: 100svh;
      height: 100dvh;

      min-height: 520px;

      overflow: hidden;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        max(20px, env(safe-area-inset-top))
        18px
        max(
          90px,
          calc(env(safe-area-inset-bottom) + 70px)
        );
    }


    /* =========================================================
       NAME
    ========================================================= */

    .name {
      position: relative;

      z-index: 30;

      width: 100%;

      text-align: center;

      will-change: transform;
    }


    h1 {
      margin: 0 auto;

      width: 100%;

      padding:
        .12em
        .12em
        .28em;

      font-family:
        "Iowan Old Style",
        "Baskerville",
        "Baskerville Old Face",
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          72px,
          11.2vw,
          160px
        );

      line-height: .99;

      font-weight: 400;

      letter-spacing: -.055em;

      font-kerning: normal;
    }


    h1 span {
      display: block;

      will-change:
        transform,
        opacity,
        filter,
        color;
    }


    .first-name {
      opacity: .03;

      filter: blur(18px);

      transform:
        translate3d(
          0,
          52px,
          0
        );

      color: var(--navy);
    }


    .last-name {
      opacity: 0;

      filter: blur(20px);

      transform:
        translate3d(
          0,
          72px,
          0
        );

      color: var(--navy);
    }


    /* =========================================================
       SOCIALS
    ========================================================= */

    .socials {
      position: fixed;

      z-index: 100;

      left: 50%;

      bottom:
        max(
          22px,
          calc(env(safe-area-inset-bottom) + 14px)
        );

      display: flex;

      align-items: center;

      gap: 14px;

      opacity: 0;

      pointer-events: none;

      transform:
        translate3d(
          -50%,
          28px,
          0
        );

      transition:
        opacity .8s
        cubic-bezier(.16,1,.3,1),

        transform .8s
        cubic-bezier(.16,1,.3,1);
    }


    .socials.visible {
      opacity: 1;

      pointer-events: auto;

      transform:
        translate3d(
          -50%,
          0,
          0
        );
    }


    .social {
      width: 50px;
      height: 50px;

      display: grid;

      place-items: center;

      flex: 0 0 auto;

      border-radius: 50%;

      color: #eee5d5;

      text-decoration: none;

      border:
        1px solid
        rgba(221,200,159,.28);

      background:
        linear-gradient(
          145deg,

          rgba(255,255,255,.13),

          rgba(255,255,255,.04)
        );

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.22),

        0 12px 38px
        rgba(0,0,0,.16);

      -webkit-backdrop-filter:
        blur(16px)
        saturate(120%);

      backdrop-filter:
        blur(16px)
        saturate(120%);

      -webkit-tap-highlight-color:
        transparent;
    }


    .social svg {
      width: 20px;
      height: 20px;

      fill: currentColor;
    }


    .instagram {
      animation:
        instagramFloat
        6.7s
        ease-in-out
        infinite alternate;
    }


    .linkedin {
      animation:
        linkedinFloat
        7.6s
        ease-in-out
        infinite alternate;
    }


    @media
    (hover:hover)
    and
    (pointer:fine) {

      .social:hover {
        border-color:
          rgba(221,200,159,.58);

        background:
          rgba(221,200,159,.14);
      }

    }


    /* =========================================================
       AMBIENT MOVEMENT
    ========================================================= */

    @keyframes navyDrift {

      from {
        transform:
          translate3d(-4%,-2%,0)
          scale(1);
      }

      to {
        transform:
          translate3d(10%,8%,0)
          scale(1.08);
      }

    }


    @keyframes blueDrift {

      from {
        transform:
          translate3d(3%,-3%,0);
      }

      to {
        transform:
          translate3d(-12%,10%,0)
          scale(1.07);
      }

    }


    @keyframes champagneDrift {

      from {
        transform:
          translate3d(-3%,4%,0);
      }

      to {
        transform:
          translate3d(8%,-10%,0)
          scale(1.08);
      }

    }


    @keyframes goldDrift {

      from {
        transform:
          translate3d(3%,3%,0);
      }

      to {
        transform:
          translate3d(-10%,-8%,0)
          scale(1.06);
      }

    }


    @keyframes midnightBlue {

      from {
        transform:
          translate3d(-3%,-2%,0);
      }

      to {
        transform:
          translate3d(12%,8%,0)
          scale(1.08);
      }

    }


    @keyframes midnightGold {

      from {
        transform:
          translate3d(3%,3%,0);
      }

      to {
        transform:
          translate3d(-12%,-10%,0)
          scale(1.08);
      }

    }


    @keyframes instagramFloat {

      from {
        transform:
          translate3d(0,3px,0)
          rotate(-1deg);
      }

      to {
        transform:
          translate3d(0,-5px,0)
          rotate(.8deg);
      }

    }


    @keyframes linkedinFloat {

      from {
        transform:
          translate3d(0,-3px,0)
          rotate(.7deg);
      }

      to {
        transform:
          translate3d(0,4px,0)
          rotate(-.8deg);
      }

    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      .experience {
        height: 270vh;
        height: 270svh;
      }


      .stage {
        min-height: 500px;

        padding-left: 10px;
        padding-right: 10px;

        padding-bottom:
          max(
            86px,
            calc(env(safe-area-inset-bottom) + 68px)
          );
      }


      h1 {
        font-size:
          clamp(
            56px,
            18.5vw,
            92px
          );

        line-height: 1.02;

        letter-spacing: -.05em;

        padding-left: .05em;
        padding-right: .05em;
        padding-bottom: .3em;
      }


      .navy-light {
        width: 195vw;
        height: 165vw;

        min-width: 0;
        min-height: 0;

        left: -128vw;
        top: -65vw;

        filter: blur(43px);
      }


      .blue-light {
        width: 175vw;
        height: 150vw;

        min-width: 0;
        min-height: 0;

        right: -120vw;
        top: 3vh;

        filter: blur(48px);
      }


      .champagne-light {
        width: 200vw;
        height: 160vw;

        min-width: 0;
        min-height: 0;

        left: -45vw;
        bottom: -95vw;

        filter: blur(48px);
      }


      .gold-light {
        width: 150vw;
        height: 125vw;

        min-width: 0;
        min-height: 0;

        right: -105vw;
        bottom: 0;

        filter: blur(52px);
      }


      /*
         Slightly less blur on mobile for performance,
         while preserving the glass treatment.
      */

      .glass-veil {
        background:
          rgba(248,245,239,.28);

        -webkit-backdrop-filter:
          blur(21px)
          saturate(112%);

        backdrop-filter:
          blur(21px)
          saturate(112%);
      }


      .midnight-glass {
        -webkit-backdrop-filter:
          blur(18px)
          saturate(112%);

        backdrop-filter:
          blur(18px)
          saturate(112%);
      }


      .midnight::before {
        width: 185vw;
        height: 155vw;

        left: -125vw;
        top: -62vw;

        filter: blur(43px);
      }


      /*
         Stronger champagne presence on mobile too.
      */

      .midnight::after {
        width: 175vw;
        height: 145vw;

        right: -110vw;
        bottom: -62vw;

        filter: blur(48px);

        background:
          radial-gradient(
            ellipse,

            rgba(238,220,184,.42) 0%,

            rgba(216,195,154,.27) 27%,

            rgba(193,153,86,.11) 48%,

            transparent 74%
          );
      }


      .gold-sweep {
        width: 230%;
        left: -65%;

        height: 110px;

        filter: blur(21px);
      }


      .gold-line {
        width: 230%;
        left: -65%;
      }


      .social {
        width: 48px;
        height: 48px;

        -webkit-backdrop-filter:
          blur(10px);

        backdrop-filter:
          blur(10px);
      }

    }


    /* =========================================================
       SMALL MOBILE
    ========================================================= */

    @media (max-width: 380px) {

      h1 {
        font-size:
          clamp(
            50px,
            17.5vw,
            69px
          );
      }


      .social {
        width: 46px;
        height: 46px;
      }

    }


    /* =========================================================
       LANDSCAPE PHONE
    ========================================================= */

    @media
    (max-height: 520px)
    and
    (orientation: landscape) {

      .experience {
        height: 290vh;
      }


      .stage {
        min-height: 100vh;

        padding-top: 15px;
        padding-bottom: 55px;
      }


      h1 {
        font-size:
          clamp(
            47px,
            10vw,
            76px
          );

        line-height: .94;
      }


      .socials {
        bottom: 10px;
      }


      .social {
        width: 42px;
        height: 42px;
      }

    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media
    (prefers-reduced-motion: reduce) {

      .light,
      .midnight::before,
      .midnight::after,
      .social {
        animation: none !important;
      }


      .first-name,
      .last-name {
        opacity: 1 !important;

        filter: none !important;

        transform: none !important;
      }

    }

  </style>
</head>


<body>


  <!-- =======================================================
       FROSTED ENVIRONMENT
  ======================================================== -->

  <div
    class="world"
    aria-hidden="true"
  >

    <!-- Diffused color behind glass -->

    <div class="light navy-light"></div>

    <div class="light blue-light"></div>

    <div class="light champagne-light"></div>

    <div class="light gold-light"></div>


    <!-- Frosted surface -->

    <div class="glass-veil"></div>

    <div class="glass-sheen"></div>


    <!-- Midnight environment -->

    <div
      class="midnight"
      id="midnight"
    ></div>

    <div
      class="midnight-glass"
      id="midnightGlass"
    ></div>


    <!-- Gold transition -->

    <div
      class="gold-sweep"
      id="goldSweep"
    ></div>

    <div
      class="gold-line"
      id="goldLine"
    ></div>


    <!-- Fine texture -->

    <div class="grain"></div>

  </div>



  <!-- =======================================================
       MAIN EXPERIENCE
  ======================================================== -->

  <main
    class="experience"
    id="experience"
  >

    <section class="stage">

      <div
        class="name"
        id="name"
      >

        <h1>

          <span
            class="first-name"
            id="firstName"
          >
            Abdullah
          </span>


          <span
            class="last-name"
            id="lastName"
          >
            Rayees.
          </span>

        </h1>

      </div>

    </section>

  </main>



  <!-- =======================================================
       SOCIAL LINKS
  ======================================================== -->

  <nav
    class="socials"
    id="socials"
    aria-label="Social profiles"
  >


    <!-- Instagram -->

    <a
      class="social instagram"
      href="https://www.instagram.com/aaabdxllah/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <path
          d="M7.75 2h8.5A5.76 5.76 0 0 1 22 7.75v8.5A5.76 5.76 0 0 1 16.25 22h-8.5A5.76 5.76 0 0 1 2 16.25v-8.5A5.76 5.76 0 0 1 7.75 2Zm0 2A3.75 3.75 0 0 0 4 7.75v8.5A3.75 3.75 0 0 0 7.75 20h8.5A3.75 3.75 0 0 0 20 16.25v-8.5A3.75 3.75 0 0 0 16.25 4h-8.5ZM17.5 5.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"
        />

      </svg>

    </a>


    <!-- LinkedIn -->

    <a
      class="social linkedin"
      href="https://www.linkedin.com/in/arayees/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="LinkedIn"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <path
          d="M5.34 3.5A2.34 2.34 0 1 1 5.34 8.18 2.34 2.34 0 0 1 5.34 3.5ZM3.32 9.75h4.04V21H3.32V9.75Zm6.55 0h3.87v1.54h.05c.54-1.02 1.86-2.1 3.83-2.1 4.1 0 4.86 2.7 4.86 6.21V21h-4.03v-4.96c0-1.18-.02-2.71-1.65-2.71-1.66 0-1.91 1.29-1.91 2.62V21h-4.02V9.75Z"
        />

      </svg>

    </a>

  </nav>



  <!-- =======================================================
       MOTION
  ======================================================== -->

  <script>

    (() => {

      const experience =
        document.getElementById(
          "experience"
        );

      const name =
        document.getElementById(
          "name"
        );

      const firstName =
        document.getElementById(
          "firstName"
        );

      const lastName =
        document.getElementById(
          "lastName"
        );

      const midnight =
        document.getElementById(
          "midnight"
        );

      const midnightGlass =
        document.getElementById(
          "midnightGlass"
        );

      const goldSweep =
        document.getElementById(
          "goldSweep"
        );

      const goldLine =
        document.getElementById(
          "goldLine"
        );

      const socials =
        document.getElementById(
          "socials"
        );

      const themeColor =
        document.querySelector(
          'meta[name="theme-color"]'
        );


      let ticking = false;



      function clamp(
        value,
        minimum,
        maximum
      ) {

        return Math.min(
          Math.max(
            value,
            minimum
          ),
          maximum
        );

      }



      function ease(t) {

        return (
          1 -
          Math.pow(
            1 - t,
            3
          )
        );

      }



      function mix(
        start,
        end,
        amount
      ) {

        return (
          start +
          (
            end -
            start
          ) *
          amount
        );

      }



      function render() {

        ticking = false;


        const rect =
          experience
            .getBoundingClientRect();


        const viewportHeight =
          window.innerHeight;


        const scrollDistance =
          Math.max(
            1,
            experience.offsetHeight -
            viewportHeight
          );


        const progress =
          clamp(
            -rect.top /
            scrollDistance,
            0,
            1
          );


        const mobile =
          window.innerWidth <= 700;



        /* =====================================
           ABDULLAH
        ====================================== */

        const firstProgress =
          ease(

            clamp(
              progress / .23,
              0,
              1
            )

          );


        firstName.style.opacity =
          .03 +
          (
            .97 *
            firstProgress
          );


        firstName.style.filter =
          `blur(${
            18 *
            (
              1 -
              firstProgress
            )
          }px)`;



        /* =====================================
           RAYEES
        ====================================== */

        const lastProgress =
          ease(

            clamp(
              (
                progress -
                .07
              ) /
              .25,

              0,
              1
            )

          );


        lastName.style.opacity =
          lastProgress;


        lastName.style.filter =
          `blur(${
            20 *
            (
              1 -
              lastProgress
            )
          }px)`;



        /* =====================================
           SUBTLE NAME SEPARATION
        ====================================== */

        const separation =
          ease(

            clamp(
              (
                progress -
                .29
              ) /
              .28,

              0,
              1
            )

          );


        const separationDistance =
          mobile
            ? 7
            : 19;


        const firstX =
          -separationDistance *
          separation;


        const lastX =
          separationDistance *
          separation;


        const firstY =
          52 *
          (
            1 -
            firstProgress
          );


        const lastY =
          72 *
          (
            1 -
            lastProgress
          );


        firstName.style.transform =
          `
            translate3d(
              ${firstX}px,
              ${firstY}px,
              0
            )
          `;


        lastName.style.transform =
          `
            translate3d(
              ${lastX}px,
              ${lastY}px,
              0
            )
          `;



        /* =====================================
           CHAMPAGNE -> MIDNIGHT
        ====================================== */

        const darkProgress =
          ease(

            clamp(
              (
                progress -
                .38
              ) /
              .31,

              0,
              1
            )

          );


        midnight.style.opacity =
          darkProgress;


        midnightGlass.style.opacity =
          darkProgress;



        /* =====================================
           NAVY TEXT -> CHAMPAGNE TEXT
        ====================================== */

        const start = {
          r: 7,
          g: 25,
          b: 43
        };


        const end = {
          r: 238,
          g: 229,
          b: 213
        };


        const red =
          Math.round(
            mix(
              start.r,
              end.r,
              darkProgress
            )
          );


        const green =
          Math.round(
            mix(
              start.g,
              end.g,
              darkProgress
            )
          );


        const blue =
          Math.round(
            mix(
              start.b,
              end.b,
              darkProgress
            )
          );


        const textColor =
          `rgb(
            ${red},
            ${green},
            ${blue}
          )`;


        firstName.style.color =
          textColor;


        lastName.style.color =
          textColor;



        /* =====================================
           GOLD REFLECTION
        ====================================== */

        const reflection =
          clamp(

            1 -
            (
              Math.abs(
                progress -
                .63
              ) /
              .15
            ),

            0,
            1

          );


        goldSweep.style.opacity =
          reflection * .82;


        goldLine.style.opacity =
          reflection * .88;


        const sweepPosition =
          -20 +
          (
            progress *
            40
          );


        const sweepTransform =
          `
            rotate(-9deg)

            translate3d(
              ${sweepPosition}%,
              0,
              0
            )
          `;


        goldSweep.style.transform =
          sweepTransform;


        goldLine.style.transform =
          sweepTransform;



        /* =====================================
           FINAL NAME SETTLE

           Maximum scale: 1.5%
        ====================================== */

        const settle =
          ease(

            clamp(
              (
                progress -
                .63
              ) /
              .37,

              0,
              1
            )

          );


        name.style.transform =
          `
            translate3d(
              0,
              ${-8 * settle}px,
              0
            )

            scale(
              ${
                1 +
                (
                  .015 *
                  settle
                )
              }
            )
          `;



        /* =====================================
           SOCIAL REVEAL
        ====================================== */

        if (
          progress >
          .72
        ) {

          socials.classList.add(
            "visible"
          );

        }

        else {

          socials.classList.remove(
            "visible"
          );

        }



        /* =====================================
           MOBILE BROWSER COLOR
        ====================================== */

        if (
          darkProgress >
          .55
        ) {

          themeColor.setAttribute(
            "content",
            "#07192b"
          );

        }

        else {

          themeColor.setAttribute(
            "content",
            "#eee6d8"
          );

        }

      }



      function requestRender() {

        if (!ticking) {

          ticking = true;

          requestAnimationFrame(
            render
          );

        }

      }



      window.addEventListener(
        "scroll",
        requestRender,
        {
          passive: true
        }
      );


      window.addEventListener(
        "resize",
        requestRender
      );


      window.addEventListener(
        "orientationchange",
        requestRender
      );


      requestRender();

    })();

  </script>


</body>
</html>
