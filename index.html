<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f3f0">

  <title>Abdullah Rayees</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;

      color: #171719;
      background: #f4f3f0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }


    /* ========================================
       BACKGROUND
    ======================================== */

    .atmosphere {
      position: fixed;
      inset: 0;

      z-index: -10;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          #f8f7f3 0%,
          #f0f2f3 47%,
          #f7f5f1 100%
        );
    }


    /* ========================================
       AMBIENT LIGHT
    ======================================== */

    .light {
      position: absolute;

      width: 780px;
      height: 440px;

      border-radius: 50%;

      filter: blur(90px);

      opacity: 0.28;

      will-change: transform;
    }


    .ice {
      left: -260px;
      top: 70px;

      background:
        rgba(155, 204, 230, 0.52);

      animation:
        iceMovement
        19s
        ease-in-out
        infinite alternate;
    }


    .violet {
      right: -290px;
      top: 180px;

      background:
        rgba(192, 174, 210, 0.42);

      animation:
        violetMovement
        24s
        ease-in-out
        infinite alternate;
    }


    .champagne {
      left: 25%;
      bottom: -100px;

      background:
        rgba(221, 205, 169, 0.34);

      animation:
        champagneMovement
        27s
        ease-in-out
        infinite alternate;
    }



    /* ========================================
       LARGE PEARL GLASS
    ======================================== */

    .pearl {
      position: absolute;

      width: 820px;
      height: 820px;

      left: 50%;
      top: 380px;

      transform:
        translateX(-50%);

      border-radius:
        48% 52% 57% 43% /
        51% 43% 57% 49%;

      background:
        linear-gradient(
          125deg,

          rgba(255,255,255,.72),

          rgba(206,220,229,.25)
          30%,

          rgba(221,210,231,.22)
          54%,

          rgba(226,218,196,.18)
          72%,

          rgba(255,255,255,.58)
        );

      border:
        1px solid
        rgba(255,255,255,.75);

      box-shadow:

        inset 45px 35px 90px
        rgba(255,255,255,.70),

        inset -40px -35px 100px
        rgba(140,155,170,.07),

        0 60px 130px
        rgba(65,70,80,.06);

      backdrop-filter:
        blur(26px)
        saturate(125%);

      -webkit-backdrop-filter:
        blur(26px)
        saturate(125%);

      animation:
        pearlMorph
        21s
        ease-in-out
        infinite alternate;

      will-change:
        transform,
        border-radius;
    }



    /* ========================================
       VERY SUBTLE GRAIN
    ======================================== */

    .grain {
      position: absolute;
      inset: 0;

      opacity: 0.11;

      background-image:
        radial-gradient(
          rgba(30,30,32,.12)
          .45px,
          transparent .55px
        );

      background-size:
        5px 5px;

      pointer-events: none;
    }



    /* ========================================
       MAIN SCROLL EXPERIENCE
    ======================================== */

    .story {
      position: relative;

      height: 260vh;
    }


    .stage {
      position: sticky;

      top: 0;

      height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      padding:
        40px
        24px
        140px;
    }



    /* ========================================
       PREMIUM TYPOGRAPHY
    ======================================== */

    .name {
      position: relative;

      z-index: 5;

      text-align: center;

      will-change:
        transform,
        opacity,
        filter;
    }


    h1 {
      margin: 0;

      padding:
        .12em
        .16em
        .22em;

      font-family:
        "Iowan Old Style",
        "Baskerville",
        "Times New Roman",
        serif;

      font-size:
        clamp(
          72px,
          11.5vw,
          158px
        );

      line-height:
        .94;

      letter-spacing:
        -.065em;

      font-weight:
        400;
    }


    h1 span {
      display: block;

      will-change:
        transform,
        opacity,
        filter;
    }


    .first-name {
      opacity: .08;

      filter:
        blur(15px);

      transform:
        translateY(40px);
    }


    .last-name {
      opacity: 0;

      filter:
        blur(18px);

      transform:
        translateY(60px);

      color: transparent;

      background:
        linear-gradient(
          105deg,

          #171719 8%,

          #35383d 48%,

          #69616d 78%,

          #464441
        );

      background-clip:
        text;

      -webkit-background-clip:
        text;
    }



    /* ========================================
       SOCIAL GLASS CAPSULE
    ======================================== */

    .social-capsule {
      position: fixed;

      z-index: 50;

      left: 50%;
      bottom: 28px;

      transform:
        translateX(-50%);

      display: flex;

      align-items: center;

      gap: 9px;

      padding:
        9px;

      border-radius:
        24px;

      border:
        1px solid
        rgba(255,255,255,.72);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.52),
          rgba(255,255,255,.25)
        );

      box-shadow:

        0 18px 60px
        rgba(45,50,58,.10),

        inset 0 1px 0
        rgba(255,255,255,.95),

        inset 0 -1px 0
        rgba(255,255,255,.28);

      backdrop-filter:
        blur(30px)
        saturate(145%);

      -webkit-backdrop-filter:
        blur(30px)
        saturate(145%);

      animation:
        capsuleFloat
        7s
        ease-in-out
        infinite alternate;
    }



    /* ========================================
       SOCIAL ICON BUTTONS
    ======================================== */

    .social-link {
      width: 48px;
      height: 48px;

      display: grid;

      place-items: center;

      position: relative;

      border-radius: 17px;

      color: #242426;

      text-decoration: none;

      background:
        rgba(255,255,255,.34);

      border:
        1px solid
        rgba(255,255,255,.52);

      box-shadow:

        inset 0 1px 0
        rgba(255,255,255,.9),

        0 7px 20px
        rgba(50,55,65,.05);

      transition:
        background .3s ease,
        transform .3s ease,
        box-shadow .3s ease;
    }


    .social-link svg {
      width: 21px;
      height: 21px;

      fill: currentColor;
    }



    /* Each icon floats independently */

    .instagram {
      animation:
        instagramFloat
        5.8s
        ease-in-out
        infinite alternate;
    }


    .linkedin {
      animation:
        linkedinFloat
        6.6s
        ease-in-out
        infinite alternate;
    }



    .social-link:hover {
      background:
        rgba(255,255,255,.68);

      box-shadow:

        inset 0 1px 0
        rgba(255,255,255,1),

        0 10px 28px
        rgba(50,55,65,.09);
    }



    /* ========================================
       AMBIENT MOTION
    ======================================== */

    @keyframes pearlMorph {

      0% {

        transform:
          translateX(-50%)
          rotate(-5deg)
          scale(.96,1.03);

        border-radius:
          48% 52% 57% 43% /
          51% 43% 57% 49%;
      }


      50% {

        transform:
          translateX(-47%)
          rotate(7deg)
          scale(1.07,.94);

        border-radius:
          57% 43% 45% 55% /
          43% 59% 41% 57%;
      }


      100% {

        transform:
          translateX(-53%)
          rotate(-3deg)
          scale(.98,1.05);

        border-radius:
          42% 58% 54% 46% /
          58% 42% 55% 45%;
      }

    }



    @keyframes iceMovement {

      from {
        transform:
          translate(0,0)
          scale(1);
      }

      to {
        transform:
          translate(180px,110px)
          scale(1.18,.88);
      }

    }


    @keyframes violetMovement {

      from {
        transform:
          translate(0,0)
          scale(1);
      }

      to {
        transform:
          translate(-180px,120px)
          scale(.90,1.15);
      }

    }


    @keyframes champagneMovement {

      from {
        transform:
          translate(0,0)
          scale(1);
      }

      to {
        transform:
          translate(90px,-150px)
          scale(1.15,.92);
      }

    }



    /* ========================================
       SOCIAL FLOATING
    ======================================== */

    @keyframes capsuleFloat {

      from {
        transform:
          translateX(-50%)
          translateY(0px);
      }

      to {
        transform:
          translateX(-50%)
          translateY(-5px);
      }

    }


    @keyframes instagramFloat {

      0% {
        transform:
          translateY(1px)
          rotate(-1deg);
      }

      100% {
        transform:
          translateY(-3px)
          rotate(1deg);
      }

    }


    @keyframes linkedinFloat {

      0% {
        transform:
          translateY(-2px)
          rotate(.8deg);
      }

      100% {
        transform:
          translateY(2px)
          rotate(-.8deg);
      }

    }



    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 650px) {

      h1 {

        font-size:
          clamp(
            64px,
            20vw,
            100px
          );

        letter-spacing:
          -.055em;
      }


      .pearl {

        width:
          620px;

        height:
          620px;

        top:
          300px;
      }


      .social-capsule {

        bottom:
          18px;
      }


      .social-link {

        width:
          46px;

        height:
          46px;
      }

    }



    /* ========================================
       REDUCED MOTION
    ======================================== */

    @media
    (prefers-reduced-motion: reduce) {

      .pearl,
      .light,
      .social-capsule,
      .social-link {

        animation:
          none !important;
      }


      .first-name,
      .last-name {

        opacity:
          1 !important;

        filter:
          none !important;

        transform:
          none !important;
      }

    }

  </style>
</head>



<body>


  <!-- ======================================
       BACKGROUND
  ======================================= -->

  <div class="atmosphere">

    <div
      class="light ice"
      id="ice"
    ></div>

    <div
      class="light violet"
      id="violet"
    ></div>

    <div
      class="light champagne"
      id="champagne"
    ></div>

    <div
      class="pearl"
      id="pearl"
    ></div>

    <div class="grain"></div>

  </div>



  <!-- ======================================
       NAME
  ======================================= -->

  <section
    class="story"
    id="story"
  >

    <div class="stage">

      <div
        class="name"
        id="name"
      >

        <h1>

          <span
            class="first-name"
            id="firstName"
          >
            Abdullah
          </span>


          <span
            class="last-name"
            id="lastName"
          >
            Rayees.
          </span>

        </h1>

      </div>

    </div>

  </section>



  <!-- ======================================
       FLOATING SOCIAL GLASS
  ======================================= -->

  <div
    class="social-capsule"
    aria-label="Social profiles"
  >


    <!-- INSTAGRAM -->

    <a
      class="social-link instagram"
      href="https://www.instagram.com/aaabdxllah/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <path
          d="M7.75 2h8.5A5.76 5.76 0 0 1 22 7.75v8.5A5.76 5.76 0 0 1 16.25 22h-8.5A5.76 5.76 0 0 1 2 16.25v-8.5A5.76 5.76 0 0 1 7.75 2Zm0 2A3.75 3.75 0 0 0 4 7.75v8.5A3.75 3.75 0 0 0 7.75 20h8.5A3.75 3.75 0 0 0 20 16.25v-8.5A3.75 3.75 0 0 0 16.25 4h-8.5ZM17.5 5.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"
        />

      </svg>

    </a>



    <!-- LINKEDIN -->

    <a
      class="social-link linkedin"
      href="https://www.linkedin.com/in/arayees/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="LinkedIn"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <path
          d="M5.34 3.5A2.34 2.34 0 1 1 5.34 8.18 2.34 2.34 0 0 1 5.34 3.5ZM3.32 9.75h4.04V21H3.32V9.75Zm6.55 0h3.87v1.54h.05c.54-1.02 1.86-2.1 3.83-2.1 4.1 0 4.86 2.7 4.86 6.21V21h-4.03v-4.96c0-1.18-.02-2.71-1.65-2.71-1.66 0-1.91 1.29-1.91 2.62V21h-4.02V9.75Z"
        />

      </svg>

    </a>

  </div>



  <!-- ======================================
       SCROLL ANIMATION
  ======================================= -->

  <script>

    const story =
      document.getElementById("story");

    const name =
      document.getElementById("name");

    const firstName =
      document.getElementById("firstName");

    const lastName =
      document.getElementById("lastName");

    const pearl =
      document.getElementById("pearl");

    const ice =
      document.getElementById("ice");

    const violet =
      document.getElementById("violet");

    const champagne =
      document.getElementById("champagne");



    function clamp(
      value,
      minimum,
      maximum
    ) {

      return Math.min(
        Math.max(
          value,
          minimum
        ),
        maximum
      );

    }



    function easeOutCubic(t) {

      return (
        1 -
        Math.pow(
          1 - t,
          3
        )
      );

    }



    function updateAnimation() {

      const rect =
        story.getBoundingClientRect();


      const scrollDistance =
        story.offsetHeight -
        window.innerHeight;


      const progress =
        clamp(

          -rect.top /
          scrollDistance,

          0,
          1

        );



      /* ABDULLAH */

      const firstProgress =
        easeOutCubic(

          clamp(
            progress / .40,
            0,
            1
          )

        );


      firstName.style.opacity =
        .08 +
        (.92 * firstProgress);


      firstName.style.filter =
        `
          blur(
            ${15 * (1 - firstProgress)}px
          )
        `;


      firstName.style.transform =
        `
          translateY(
            ${40 * (1 - firstProgress)}px
          )
        `;



      /* RAYEES */

      const lastProgress =
        easeOutCubic(

          clamp(
            (progress - .12) /
            .42,

            0,
            1
          )

        );


      lastName.style.opacity =
        lastProgress;


      lastName.style.filter =
        `
          blur(
            ${18 * (1 - lastProgress)}px
          )
        `;


      lastName.style.transform =
        `
          translateY(
            ${60 * (1 - lastProgress)}px
          )
        `;



      /* NAME SETTLE */

      const settle =
        easeOutCubic(

          clamp(
            (progress - .48) /
            .52,

            0,
            1
          )

        );


      /*
       Only 4% scale increase.
       Keeps it restrained.
      */

      const nameScale =
        1 +
        (.04 * settle);


      const nameY =
        -14 * settle;


      name.style.transform =
        `
          translateY(
            ${nameY}px
          )

          scale(
            ${nameScale}
          )
        `;



      /* PEARL SCROLL MOTION */

      pearl.style.translate =
        `
          ${(progress - .5) * 30}px
          ${progress * -48}px
        `;



      /* AMBIENT PARALLAX */

      ice.style.translate =
        `
          ${progress * 48}px
          ${progress * 24}px
        `;


      violet.style.translate =
        `
          ${progress * -58}px
          ${progress * 32}px
        `;


      champagne.style.translate =
        `
          ${progress * 22}px
          ${progress * -48}px
        `;

    }



    window.addEventListener(
      "scroll",
      updateAnimation,
      {
        passive: true
      }
    );


    window.addEventListener(
      "resize",
      updateAnimation
    );


    updateAnimation();

  </script>


</body>
</html>
