<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#eee6d8">

  <title>Abdullah Rayees</title>

  <!-- =========================================================
       UPDATE LOG — VERSION 1.6

       Added:
       - Reliable favicon fallbacks
       - Subtle movement and breathing scale for the champagne burst
       - Restored social hover inversion and scale feedback
       - Corrected Instagram icon geometry

       Preservation rule:
       Every other visual effect, interaction, link, animation,
       responsive rule, and scroll behavior remains unchanged.
  ========================================================== -->

  <!-- =========================================================
       FEATURE MAP

       1. Design system / colors
       2. Background atmosphere
       3. Glass shapes and veil
       4. Midnight transition
       5. Champagne burst
       6. Brand mark
       7. Name animation
       8. Scroll cue
       9. Social links and hover feedback
      10. Responsive rules
      11. Reduced-motion accessibility
      12. HTML structure
      13. Scroll controller

       Future edits should be limited to the relevant section.
  ========================================================== -->

  <!-- =========================================================
       FAVICON AND APP ICONS
       Keep these files beside index.html:
       - favicon.ico
       - AR_mark_navy.svg
       - AR_mark_navy_1024.png
  ========================================================== -->

  <link
    rel="icon"
    type="image/svg+xml"
    href="./AR_mark_navy.svg?v=2"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="1024x1024"
    href="./AR_mark_navy_1024.png?v=2"
  >

  <link
    rel="shortcut icon"
    href="./favicon.ico?v=2"
  >

  <link
    rel="apple-touch-icon"
    sizes="1024x1024"
    href="./AR_mark_navy_1024.png?v=2"
  >

  <style>

    /* =========================================================
       DESIGN SYSTEM
    ========================================================= */

    :root {
      --ivory: #f8f5ef;

      --champagne: #eee4d2;
      --champagne-light: #f8f3e9;
      --champagne-mid: #dcc8a4;

      --navy: #07192b;
      --navy-deep: #06182a;
      --navy-mid: #0b2943;
      --navy-soft: #12344f;

      --gold: #b89558;
      --gold-light: #ddc89f;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
    }


    html {
      background: var(--champagne);

      -webkit-text-size-adjust: 100%;
    }


    body {
      overflow-x: hidden;

      color: var(--navy);

      background: var(--champagne);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;

      overscroll-behavior-x: none;
    }


    a {
      -webkit-tap-highlight-color: transparent;
    }



    /* =========================================================
       WORLD
    ========================================================= */

    .world {
      position: fixed;

      inset: 0;

      z-index: 0;

      overflow: hidden;

      pointer-events: none;

      background:
        linear-gradient(
          145deg,
          #faf7f1 0%,
          #eee5d6 46%,
          #dfd0b8 100%
        );

      transform: translateZ(0);
    }



    /* =========================================================
       DIFFUSED LIGHT
    ========================================================= */

    .light {
      position: absolute;

      border-radius: 50%;

      opacity: .78;

      will-change: transform;
    }



    /* =========================================================
       NAVY OPENING LIGHT
    ========================================================= */

    .navy-light {
      width: 110vw;
      height: 95vw;

      min-width: 950px;
      min-height: 800px;

      left: -52vw;
      top: -40vw;

      background:
        radial-gradient(
          ellipse at center,

          rgba(5,25,45,.68) 0%,

          rgba(13,48,77,.42) 24%,

          rgba(32,82,116,.20) 46%,

          rgba(46,96,130,.07) 60%,

          transparent 76%
        );

      filter: blur(58px);

      animation:
        navyDrift
        25s
        ease-in-out
        infinite alternate;
    }



    /* =========================================================
       STEEL BLUE REFLECTION
    ========================================================= */

    .blue-light {
      width: 95vw;
      height: 85vw;

      min-width: 800px;
      min-height: 700px;

      right: -52vw;
      top: -18vw;

      background:
        radial-gradient(
          ellipse at center,

          rgba(64,117,156,.34),

          rgba(78,128,164,.16) 40%,

          rgba(105,148,176,.05) 58%,

          transparent 74%
        );

      filter: blur(72px);

      animation:
        blueDrift
        30s
        ease-in-out
        infinite alternate;
    }



    /* =========================================================
       CHAMPAGNE LIGHT
    ========================================================= */

    .champagne-light {
      width: 105vw;
      height: 80vw;

      min-width: 900px;
      min-height: 700px;

      left: 0;
      bottom: -55vw;

      background:
        radial-gradient(
          ellipse at center,

          rgba(232,211,172,.58),

          rgba(211,181,127,.22) 38%,

          transparent 72%
        );

      filter: blur(65px);

      animation:
        champagneDrift
        32s
        ease-in-out
        infinite alternate;
    }



    /* =========================================================
       GOLD LIGHT
    ========================================================= */

    .gold-light {
      width: 75vw;
      height: 60vw;

      min-width: 650px;
      min-height: 520px;

      right: -40vw;
      bottom: -18vw;

      background:
        radial-gradient(
          ellipse at center,

          rgba(181,137,70,.30),

          rgba(199,163,101,.11) 40%,

          transparent 72%
        );

      filter: blur(80px);

      animation:
        goldDrift
        27s
        ease-in-out
        infinite alternate;
    }



    /* =========================================================
       LIQUID GLASS DRIFT
    ========================================================= */

    .liquid-glass {
      position: absolute;

      z-index: 3;

      border:
        1px solid
        rgba(255,255,255,.26);

      background:
        linear-gradient(
          135deg,

          rgba(255,255,255,.14),

          rgba(255,255,255,.045) 38%,

          rgba(221,200,159,.025) 65%,

          rgba(255,255,255,.09)
        );

      box-shadow:

        inset 30px 24px 70px
        rgba(255,255,255,.12),

        inset -28px -24px 70px
        rgba(7,25,43,.035),

        0 35px 90px
        rgba(6,24,42,.035);

      -webkit-backdrop-filter:
        blur(17px)
        saturate(125%);

      backdrop-filter:
        blur(17px)
        saturate(125%);

      will-change:
        transform,
        border-radius;
    }


    .liquid-glass::before {
      content: "";

      position: absolute;

      inset: 4%;

      border-radius: inherit;

      background:
        linear-gradient(
          130deg,

          rgba(255,255,255,.15),

          transparent 27%,

          transparent 70%,

          rgba(255,255,255,.03)
        );
    }


    .liquid-glass::after {
      content: "";

      position: absolute;

      width: 48%;
      height: 28%;

      left: 15%;
      top: 12%;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse,

          rgba(255,255,255,.13),

          transparent 70%
        );

      filter: blur(12px);

      transform:
        rotate(-18deg);
    }


    .glass-one {
      width: 570px;
      height: 570px;

      left: -170px;
      top: 19%;

      border-radius:
        58% 42% 61% 39% /
        45% 59% 41% 55%;

      animation:
        glassOneDrift
        21s
        cubic-bezier(.45,.05,.25,1)
        infinite alternate;
    }


    .glass-two {
      width: 720px;
      height: 720px;

      right: -260px;
      top: 42%;

      border-radius:
        39% 61% 46% 54% /
        62% 38% 58% 42%;

      animation:
        glassTwoDrift
        27s
        cubic-bezier(.45,.05,.25,1)
        infinite alternate;
    }


    .glass-three {
      width: 330px;
      height: 330px;

      left: 43%;
      bottom: -80px;

      border-radius:
        52% 48% 43% 57% /
        58% 42% 56% 44%;

      opacity: .72;

      animation:
        glassThreeDrift
        18s
        cubic-bezier(.45,.05,.25,1)
        infinite alternate;
    }



    /* =========================================================
       FROSTED GLASS VEIL
    ========================================================= */

    .glass-veil {
      position: absolute;

      inset: 0;

      z-index: 4;

      background:
        linear-gradient(
          135deg,

          rgba(255,255,255,.31),

          rgba(255,255,255,.16) 35%,

          rgba(246,242,234,.21) 65%,

          rgba(255,255,255,.29)
        );

      -webkit-backdrop-filter:
        blur(29px)
        saturate(116%);

      backdrop-filter:
        blur(29px)
        saturate(116%);

      box-shadow:
        inset 0 0 160px
        rgba(255,255,255,.16);

      pointer-events: none;
    }



    /* =========================================================
       PEARL SHEEN
    ========================================================= */

    .glass-sheen {
      position: absolute;

      inset: 0;

      z-index: 5;

      opacity: .30;

      background:
        linear-gradient(
          115deg,

          rgba(255,255,255,.18) 0%,

          transparent 28%,

          rgba(218,200,164,.08) 50%,

          transparent 70%,

          rgba(255,255,255,.12) 100%
        );

      pointer-events: none;
    }



    /* =========================================================
       MIDNIGHT WORLD
    ========================================================= */

    .midnight {
      position: absolute;

      inset: 0;

      z-index: 6;

      opacity: 0;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,

          #123957 0%,

          #0a2943 34%,

          #071d32 65%,

          #051524 100%
        );

      will-change: opacity;
    }


    .midnight::before {
      content: "";

      position: absolute;

      width: 95vw;
      height: 80vw;

      left: -52vw;
      top: -38vw;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse,

          rgba(66,126,166,.32),

          rgba(32,79,112,.13) 42%,

          transparent 72%
        );

      filter: blur(65px);

      animation:
        midnightBlue
        27s
        ease-in-out
        infinite alternate;
    }


    /* =========================================================
       CHAMPAGNE BURST

       Edit only these values when adjusting the lower-right
       champagne glow. Its opacity still follows the midnight
       scroll transition in the JavaScript section below.
    ========================================================== */

    .midnight::after {
      content: "";

      position: absolute;

      width: 95vw;
      height: 80vw;

      right: -45vw;
      bottom: -42vw;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse,

          rgba(238,220,184,.38) 0%,

          rgba(216,195,154,.24) 25%,

          rgba(193,153,86,.10) 48%,

          transparent 74%
        );

      filter: blur(72px);

      animation:
        midnightGold
        24s
        ease-in-out
        infinite;
    }



    /* =========================================================
       MIDNIGHT GLASS
    ========================================================= */

    .midnight-glass {
      position: absolute;

      inset: 0;

      z-index: 7;

      opacity: 0;

      background:
        linear-gradient(
          135deg,

          rgba(255,255,255,.018),

          rgba(6,24,42,.07),

          rgba(221,200,159,.015)
        );

      -webkit-backdrop-filter:
        blur(27px)
        saturate(118%);

      backdrop-filter:
        blur(27px)
        saturate(118%);

      pointer-events: none;

      will-change: opacity;
    }



    /* =========================================================
       GOLD TRANSITION
    ========================================================= */

    .gold-sweep {
      position: absolute;

      z-index: 8;

      width: 190%;
      height: 150px;

      left: -45%;
      top: 49%;

      opacity: 0;

      background:
        linear-gradient(
          90deg,

          transparent 25%,

          rgba(221,200,159,0) 36%,

          rgba(221,200,159,.09) 44%,

          rgba(221,200,159,.38) 50%,

          rgba(184,149,88,.12) 57%,

          transparent 70%
        );

      filter: blur(28px);

      transform:
        rotate(-9deg)
        translate3d(-20%,0,0);

      will-change:
        opacity,
        transform;
    }


    .gold-line {
      position: absolute;

      z-index: 9;

      width: 190%;
      height: 1px;

      left: -45%;
      top: 50%;

      opacity: 0;

      background:
        linear-gradient(
          90deg,

          transparent,

          rgba(221,200,159,.10),

          rgba(235,214,174,.92),

          rgba(184,149,88,.28),

          transparent
        );

      box-shadow:
        0 0 30px
        rgba(221,200,159,.30);

      transform:
        rotate(-9deg)
        translate3d(-20%,0,0);

      will-change:
        opacity,
        transform;
    }



    /* =========================================================
       GRAIN
    ========================================================= */

    .grain {
      position: absolute;

      inset: 0;

      z-index: 10;

      opacity: .035;

      background-image:
        radial-gradient(
          rgba(20,20,22,.30)
          .4px,
          transparent .5px
        );

      background-size: 5px 5px;

      pointer-events: none;
    }



    /* =========================================================
       BRAND MARK
    ========================================================= */

    .brand-mark {
      position: fixed;

      z-index: 200;

      top:
        max(
          24px,
          calc(env(safe-area-inset-top) + 16px)
        );

      left:
        max(
          28px,
          calc(env(safe-area-inset-left) + 20px)
        );

      width: 54px;
      height: 54px;

      display: block;

      background:
        rgb(
          var(--logo-r),
          var(--logo-g),
          var(--logo-b)
        );

      --logo-r: 7;
      --logo-g: 25;
      --logo-b: 43;

      -webkit-mask:
        url("AR_mark_navy.svg")
        center / contain
        no-repeat;

      mask:
        url("AR_mark_navy.svg")
        center / contain
        no-repeat;

      transition:
        opacity .3s ease;

      -webkit-tap-highlight-color: transparent;
    }


    @media
    (hover:hover)
    and
    (pointer:fine) {

      .brand-mark:hover {
        opacity: .68;
      }

    }



    /* =========================================================
       EXPERIENCE
    ========================================================= */

    .experience {
      position: relative;

      z-index: 20;

      height: 320vh;
      height: 320svh;
    }


    .stage {
      position: sticky;

      top: 0;

      width: 100%;

      height: 100vh;
      height: 100svh;
      height: 100dvh;

      min-height: 520px;

      overflow: hidden;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        max(20px, env(safe-area-inset-top))
        18px
        max(
          90px,
          calc(env(safe-area-inset-bottom) + 70px)
        );
    }



    /* =========================================================
       NAME
    ========================================================= */

    .name {
      position: relative;

      z-index: 30;

      width: 100%;

      text-align: center;

      will-change: transform;
    }


    h1 {
      margin: 0 auto;

      width: 100%;

      padding:
        .12em
        .12em
        .28em;

      font-family:
        "Iowan Old Style",
        "Baskerville",
        "Baskerville Old Face",
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          72px,
          11.2vw,
          160px
        );

      line-height: .99;

      font-weight: 400;

      letter-spacing: -.055em;

      font-kerning: normal;
    }


    h1 span {
      display: block;

      will-change:
        transform,
        opacity,
        filter,
        color;
    }


    .first-name {
      opacity: .03;

      filter: blur(18px);

      transform:
        translate3d(
          0,
          52px,
          0
        );

      color: var(--navy);
    }


    .last-name {
      opacity: 0;

      filter: blur(20px);

      transform:
        translate3d(
          0,
          72px,
          0
        );

      color: var(--navy);
    }



    /* =========================================================
       SCROLL CUE
    ========================================================= */

    .scroll-cue {
      position: absolute;

      z-index: 50;

      left: 50%;

      bottom:
        max(
          34px,
          calc(env(safe-area-inset-bottom) + 24px)
        );

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 12px;

      transform:
        translate3d(-50%,0,0);

      pointer-events: none;

      will-change:
        opacity,
        transform,
        filter;
    }



    /* Fancy editorial "Scroll" */

    .scroll-label {
      color:
        rgba(7,25,43,.76);

      font-family:
        "Iowan Old Style",
        "Baskerville",
        "Baskerville Old Face",
        Georgia,
        "Times New Roman",
        serif;

      font-size: 14px;

      font-style: italic;

      font-weight: 400;

      line-height: 1;

      letter-spacing: .07em;
    }



    /* Vertical scroll line */

    .scroll-track {
      position: relative;

      display: block;

      width: 1px;
      height: 56px;

      overflow: hidden;

      background:
        linear-gradient(
          to bottom,

          rgba(7,25,43,.38),

          rgba(7,25,43,.07)
        );

      transform-origin:
        center bottom;

      will-change:
        transform,
        opacity;
    }



    /* Moving gold/champagne reflection */

    .scroll-energy {
      position: absolute;

      top: -40%;
      left: 0;

      width: 1px;
      height: 45%;

      background:
        linear-gradient(
          to bottom,

          transparent,

          rgba(184,149,88,.95),

          rgba(221,200,159,.92),

          transparent
        );

      animation:
        scrollEnergy
        2.8s
        cubic-bezier(.45,.05,.3,1)
        infinite;
    }



    /* =========================================================
       SOCIALS
    ========================================================= */

    .socials {
      position: fixed;

      z-index: 100;

      left: 50%;

      bottom:
        max(
          22px,
          calc(env(safe-area-inset-bottom) + 14px)
        );

      display: flex;

      align-items: center;

      gap: 14px;

      opacity: 0;

      pointer-events: none;

      transform:
        translate3d(
          -50%,
          28px,
          0
        );

      transition:
        opacity .8s
        cubic-bezier(.16,1,.3,1),

        transform .8s
        cubic-bezier(.16,1,.3,1);
    }


    .socials.visible {
      opacity: 1;

      pointer-events: auto;

      transform:
        translate3d(
          -50%,
          0,
          0
        );
    }


    /* =========================================================
       SOCIAL FLOATING MOTION

       The outer link owns ambient movement. Keep hover transforms
       on .social-surface below so these two systems stay isolated.
    ========================================================== */

    .social {
      width: 50px;
      height: 50px;

      display: block;

      flex: 0 0 auto;

      border-radius: 50%;

      text-decoration: none;

      -webkit-tap-highlight-color: transparent;

      will-change: transform;
    }


    /* =========================================================
       SOCIAL SURFACE AND HOVER FEEDBACK

       The inner surface owns color inversion, enlargement and
       press feedback. Edit this section without touching motion.
    ========================================================== */

    .social-surface {
      width: 100%;
      height: 100%;

      display: grid;

      place-items: center;

      border-radius: 50%;

      color: #eee5d5;

      border:
        1px solid
        rgba(221,200,159,.28);

      background:
        linear-gradient(
          145deg,

          rgba(255,255,255,.13),

          rgba(255,255,255,.04)
        );

      box-shadow:

        inset 0 1px 0
        rgba(255,255,255,.22),

        0 12px 38px
        rgba(0,0,0,.16);

      -webkit-backdrop-filter:
        blur(16px)
        saturate(120%);

      backdrop-filter:
        blur(16px)
        saturate(120%);

      transition:
        transform .34s
        cubic-bezier(.16,1,.3,1),

        color .34s ease,

        background .34s ease,

        border-color .34s ease,

        box-shadow .34s ease;
    }


    .social svg {
      width: 20px;
      height: 20px;

      fill: currentColor;

      transition:
        transform .34s
        cubic-bezier(.16,1,.3,1);
    }


    @media
    (hover:hover)
    and
    (pointer:fine) {

      .social:hover {
        z-index: 2;
      }


      .social:hover .social-surface {
        transform: scale(1.07);

        color: var(--navy-deep);

        background:
          linear-gradient(
            145deg,

            rgba(248,243,233,.98),

            rgba(238,228,210,.90)
          );

        border-color: rgba(255,255,255,.75);

        box-shadow:
          inset 0 1px 0
          rgba(255,255,255,.95),

          0 15px 44px
          rgba(4,20,33,.18),

          0 0 0 1px
          rgba(184,149,88,.06);
      }


      .social:hover svg {
        transform: scale(1.04);
      }

    }


    .social:active .social-surface {
      transform: scale(.96);

      color: var(--navy-deep);

      background: var(--champagne);
    }


    .instagram {
      animation:
        instagramFloat
        6.7s
        ease-in-out
        infinite alternate;
    }


    .linkedin {
      animation:
        linkedinFloat
        7.6s
        ease-in-out
        infinite alternate;
    }



    /* =========================================================
       ANIMATIONS
    ========================================================= */

    @keyframes scrollEnergy {

      0% {
        transform:
          translate3d(0,-120%,0);

        opacity: 0;
      }


      18% {
        opacity: 1;
      }


      75% {
        opacity: .9;
      }


      100% {
        transform:
          translate3d(0,330%,0);

        opacity: 0;
      }

    }


    @keyframes navyDrift {

      from {
        transform:
          translate3d(-4%,-2%,0)
          scale(1);
      }

      to {
        transform:
          translate3d(10%,8%,0)
          scale(1.08);
      }

    }


    @keyframes blueDrift {

      from {
        transform:
          translate3d(3%,-3%,0);
      }

      to {
        transform:
          translate3d(-12%,10%,0)
          scale(1.07);
      }

    }


    @keyframes champagneDrift {

      from {
        transform:
          translate3d(-3%,4%,0);
      }

      to {
        transform:
          translate3d(8%,-10%,0)
          scale(1.08);
      }

    }


    @keyframes goldDrift {

      from {
        transform:
          translate3d(3%,3%,0);
      }

      to {
        transform:
          translate3d(-10%,-8%,0)
          scale(1.06);
      }

    }


    @keyframes midnightBlue {

      from {
        transform:
          translate3d(-3%,-2%,0);
      }

      to {
        transform:
          translate3d(12%,8%,0)
          scale(1.08);
      }

    }


    @keyframes midnightGold {

      0% {
        transform:
          translate3d(3%,3%,0)
          scale(.98);
      }

      50% {
        transform:
          translate3d(-5%,-4%,0)
          scale(1.04);
      }

      100% {
        transform:
          translate3d(-11%,-8%,0)
          scale(1);
      }

    }


    @keyframes glassOneDrift {

      0% {
        transform:
          translate3d(-20px,-15px,0)
          rotate(-7deg)
          scale(1);

        border-radius:
          58% 42% 61% 39% /
          45% 59% 41% 55%;
      }


      50% {
        transform:
          translate3d(105px,75px,0)
          rotate(9deg)
          scale(1.08,.94);

        border-radius:
          44% 56% 47% 53% /
          60% 40% 57% 43%;
      }


      100% {
        transform:
          translate3d(180px,130px,0)
          rotate(18deg)
          scale(.95,1.10);

        border-radius:
          61% 39% 55% 45% /
          42% 61% 39% 58%;
      }

    }


    @keyframes glassTwoDrift {

      0% {
        transform:
          translate3d(20px,10px,0)
          rotate(6deg)
          scale(1);

        border-radius:
          39% 61% 46% 54% /
          62% 38% 58% 42%;
      }


      50% {
        transform:
          translate3d(-95px,-45px,0)
          rotate(-8deg)
          scale(.96,1.07);

        border-radius:
          56% 44% 59% 41% /
          43% 57% 46% 54%;
      }


      100% {
        transform:
          translate3d(-180px,-100px,0)
          rotate(-17deg)
          scale(1.08,.93);

        border-radius:
          62% 38% 53% 47% /
          40% 60% 44% 56%;
      }

    }


    @keyframes glassThreeDrift {

      0% {
        transform:
          translate3d(0,20px,0)
          rotate(-4deg)
          scale(.96);
      }


      100% {
        transform:
          translate3d(-110px,-125px,0)
          rotate(14deg)
          scale(1.14,.92);
      }

    }


    @keyframes instagramFloat {

      from {
        transform:
          translate3d(0,3px,0)
          rotate(-1deg);
      }

      to {
        transform:
          translate3d(0,-5px,0)
          rotate(.8deg);
      }

    }


    @keyframes linkedinFloat {

      from {
        transform:
          translate3d(0,-3px,0)
          rotate(.7deg);
      }

      to {
        transform:
          translate3d(0,4px,0)
          rotate(-.8deg);
      }

    }



    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 700px) {

      .experience {
        height: 270vh;
        height: 270svh;
      }


      .stage {
        min-height: 500px;

        padding-left: 10px;
        padding-right: 10px;

        padding-bottom:
          max(
            86px,
            calc(env(safe-area-inset-bottom) + 68px)
          );
      }


      h1 {
        font-size:
          clamp(
            56px,
            18.5vw,
            92px
          );

        line-height: 1.02;

        letter-spacing: -.05em;

        padding-left: .05em;
        padding-right: .05em;
        padding-bottom: .3em;
      }



      /* Logo */

      .brand-mark {
        width: 43px;
        height: 43px;

        top:
          max(
            18px,
            calc(env(safe-area-inset-top) + 10px)
          );

        left:
          max(
            18px,
            calc(env(safe-area-inset-left) + 14px)
          );
      }



      /* Scroll cue */

      .scroll-cue {
        bottom:
          max(
            28px,
            calc(env(safe-area-inset-bottom) + 20px)
          );

        gap: 10px;
      }


      .scroll-label {
        font-size: 12px;
      }


      .scroll-track {
        height: 44px;
      }



      /* Background */

      .navy-light {
        width: 195vw;
        height: 165vw;

        min-width: 0;
        min-height: 0;

        left: -128vw;
        top: -65vw;

        filter: blur(43px);
      }


      .blue-light {
        width: 175vw;
        height: 150vw;

        min-width: 0;
        min-height: 0;

        right: -120vw;
        top: 3vh;

        filter: blur(48px);
      }


      .champagne-light {
        width: 200vw;
        height: 160vw;

        min-width: 0;
        min-height: 0;

        left: -45vw;
        bottom: -95vw;

        filter: blur(48px);
      }


      .gold-light {
        width: 150vw;
        height: 125vw;

        min-width: 0;
        min-height: 0;

        right: -105vw;
        bottom: 0;

        filter: blur(52px);
      }



      /* Liquid glass */

      .liquid-glass {
        -webkit-backdrop-filter:
          blur(9px)
          saturate(118%);

        backdrop-filter:
          blur(9px)
          saturate(118%);
      }


      .glass-one {
        width: 390px;
        height: 390px;

        left: -250px;
        top: 17%;
      }


      .glass-two {
        width: 470px;
        height: 470px;

        right: -330px;
        top: 48%;
      }


      .glass-three {
        width: 220px;
        height: 220px;

        left: 35%;
        bottom: -70px;

        opacity: .52;
      }



      /* Main veil */

      .glass-veil {
        background:
          rgba(248,245,239,.25);

        -webkit-backdrop-filter:
          blur(18px)
          saturate(110%);

        backdrop-filter:
          blur(18px)
          saturate(110%);
      }


      .midnight-glass {
        -webkit-backdrop-filter:
          blur(16px)
          saturate(110%);

        backdrop-filter:
          blur(16px)
          saturate(110%);
      }


      .midnight::before {
        width: 185vw;
        height: 155vw;

        left: -125vw;
        top: -62vw;

        filter: blur(43px);
      }


      .midnight::after {
        width: 175vw;
        height: 145vw;

        right: -110vw;
        bottom: -62vw;

        filter: blur(48px);

        background:
          radial-gradient(
            ellipse,

            rgba(238,220,184,.42) 0%,

            rgba(216,195,154,.27) 27%,

            rgba(193,153,86,.11) 48%,

            transparent 74%
          );
      }


      .gold-sweep {
        width: 230%;
        left: -65%;

        height: 110px;

        filter: blur(21px);
      }


      .gold-line {
        width: 230%;
        left: -65%;
      }


      .social {
        width: 48px;
        height: 48px;
      }

      .social-surface {
        -webkit-backdrop-filter:
          blur(10px);

        backdrop-filter:
          blur(10px);
      }

    }



    /* =========================================================
       SMALL MOBILE
    ========================================================= */

    @media (max-width: 380px) {

      h1 {
        font-size:
          clamp(
            50px,
            17.5vw,
            69px
          );
      }


      .brand-mark {
        width: 39px;
        height: 39px;
      }


      .glass-one {
        width: 340px;
        height: 340px;
      }


      .glass-two {
        width: 410px;
        height: 410px;
      }


      .social {
        width: 46px;
        height: 46px;
      }

    }



    /* =========================================================
       LANDSCAPE PHONE
    ========================================================= */

    @media
    (max-height: 520px)
    and
    (orientation: landscape) {

      .experience {
        height: 290vh;
      }


      .stage {
        min-height: 100vh;

        padding-top: 15px;
        padding-bottom: 55px;
      }


      h1 {
        font-size:
          clamp(
            47px,
            10vw,
            76px
          );

        line-height: .94;
      }


      .brand-mark {
        width: 38px;
        height: 38px;

        top: 14px;
        left: 16px;
      }


      .scroll-cue {
        bottom: 12px;
      }


      .scroll-track {
        height: 30px;
      }


      .socials {
        bottom: 10px;
      }


      .social {
        width: 42px;
        height: 42px;
      }

    }



    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media
    (prefers-reduced-motion: reduce) {

      .light,
      .liquid-glass,
      .midnight::before,
      .midnight::after,
      .social,
      .scroll-energy {
        animation: none !important;
      }


      .first-name,
      .last-name {
        opacity: 1 !important;

        filter: none !important;

        transform: none !important;
      }

    }

  </style>
</head>


<body>


  <!-- =======================================================
       BACKGROUND WORLD
  ======================================================== -->

  <div
    class="world"
    aria-hidden="true"
  >

    <!-- Diffused color -->

    <div class="light navy-light"></div>

    <div class="light blue-light"></div>

    <div class="light champagne-light"></div>

    <div class="light gold-light"></div>



    <!-- Liquid glass forms -->

    <div
      class="liquid-glass glass-one"
    ></div>

    <div
      class="liquid-glass glass-two"
    ></div>

    <div
      class="liquid-glass glass-three"
    ></div>



    <!-- Frosted surface -->

    <div class="glass-veil"></div>

    <div class="glass-sheen"></div>



    <!-- Midnight state -->

    <div
      class="midnight"
      id="midnight"
    ></div>

    <div
      class="midnight-glass"
      id="midnightGlass"
    ></div>



    <!-- Gold transition -->

    <div
      class="gold-sweep"
      id="goldSweep"
    ></div>

    <div
      class="gold-line"
      id="goldLine"
    ></div>



    <!-- Texture -->

    <div class="grain"></div>

  </div>



  <!-- =======================================================
       AR LOGO
  ======================================================== -->

  <a
    class="brand-mark"
    id="brandMark"
    href="#"
    aria-label="Abdullah Rayees — Home"
  ></a>



  <!-- =======================================================
       EXPERIENCE
  ======================================================== -->

  <main
    class="experience"
    id="experience"
  >

    <section class="stage">


      <!-- ===================================================
           SCROLL INDICATOR
      ==================================================== -->

      <div
        class="scroll-cue"
        id="scrollCue"
        aria-hidden="true"
      >

        <span class="scroll-label">
          Scroll
        </span>

        <span
          class="scroll-track"
          id="scrollTrack"
        >

          <span class="scroll-energy"></span>

        </span>

      </div>



      <!-- ===================================================
           NAME
      ==================================================== -->

      <div
        class="name"
        id="name"
      >

        <h1>

          <span
            class="first-name"
            id="firstName"
          >
            Abdullah
          </span>


          <span
            class="last-name"
            id="lastName"
          >
            Rayees.
          </span>

        </h1>

      </div>

    </section>

  </main>



  <!-- =======================================================
       SOCIAL LINKS
  ======================================================== -->

  <nav
    class="socials"
    id="socials"
    aria-label="Social profiles"
  >


    <!-- Instagram -->

    <a
      class="social instagram"
      href="https://www.instagram.com/aaabdxllah/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram"
    >

      <span class="social-surface">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <rect
            x="3"
            y="3"
            width="18"
            height="18"
            rx="5"
            ry="5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />

          <circle
            cx="12"
            cy="12"
            r="4.25"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />

          <circle
            cx="17.5"
            cy="6.5"
            r="1.25"
            fill="currentColor"
          />

        </svg>

      </span>

    </a>



    <!-- LinkedIn -->

    <a
      class="social linkedin"
      href="https://www.linkedin.com/in/arayees/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="LinkedIn"
    >

      <span class="social-surface">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path
            d="M5.34 3.5A2.34 2.34 0 1 1 5.34 8.18 2.34 2.34 0 1 1 5.34 3.5ZM3.32 9.75h4.04V21H3.32V9.75Zm6.55 0h3.87v1.54h.05c.54-1.02 1.86-2.1 3.83-2.1 4.1 0 4.86 2.7 4.86 6.21V21h-4.03v-4.96c0-1.18-.02-2.71-1.65-2.71-1.66 0-1.91 1.29-1.91 2.62V21h-4.02V9.75Z"
          />

        </svg>

      </span>

    </a>

  </nav>



  <!-- =======================================================
       MOTION
  ======================================================== -->

  <script>

    (() => {

      const experience =
        document.getElementById(
          "experience"
        );


      const name =
        document.getElementById(
          "name"
        );


      const firstName =
        document.getElementById(
          "firstName"
        );


      const lastName =
        document.getElementById(
          "lastName"
        );


      const midnight =
        document.getElementById(
          "midnight"
        );


      const midnightGlass =
        document.getElementById(
          "midnightGlass"
        );


      const goldSweep =
        document.getElementById(
          "goldSweep"
        );


      const goldLine =
        document.getElementById(
          "goldLine"
        );


      const socials =
        document.getElementById(
          "socials"
        );


      const scrollCue =
        document.getElementById(
          "scrollCue"
        );


      const scrollTrack =
        document.getElementById(
          "scrollTrack"
        );


      const brandMark =
        document.getElementById(
          "brandMark"
        );


      const themeColor =
        document.querySelector(
          'meta[name="theme-color"]'
        );


      let ticking = false;



      /* =====================================================
         HELPERS
      ====================================================== */

      function clamp(
        value,
        minimum,
        maximum
      ) {

        return Math.min(
          Math.max(
            value,
            minimum
          ),
          maximum
        );

      }



      function ease(t) {

        return (
          1 -
          Math.pow(
            1 - t,
            3
          )
        );

      }



      function mix(
        start,
        end,
        amount
      ) {

        return (
          start +
          (
            end -
            start
          ) *
          amount
        );

      }



      /* =====================================================
         RENDER
      ====================================================== */

      function render() {

        ticking = false;


        const rect =
          experience
            .getBoundingClientRect();


        const viewportHeight =
          window.innerHeight;


        const scrollDistance =
          Math.max(
            1,
            experience.offsetHeight -
            viewportHeight
          );


        const progress =
          clamp(
            -rect.top /
            scrollDistance,
            0,
            1
          );


        const mobile =
          window.innerWidth <= 700;



        /* =================================================
           SCROLL CUE

           It rises, blurs and dissolves as scrolling starts.
           The line retracts at the same time.
        ================================================= */

        const cueProgress =
          ease(

            clamp(
              progress / .10,
              0,
              1
            )

          );


        scrollCue.style.opacity =
          1 - cueProgress;


        scrollCue.style.filter =
          `blur(${
            cueProgress * 5
          }px)`;


        scrollCue.style.transform =
          `
            translate3d(
              -50%,
              ${-16 * cueProgress}px,
              0
            )
          `;


        scrollTrack.style.transform =
          `
            scaleY(
              ${
                1 -
                (.92 * cueProgress)
              }
            )
          `;



        /* =================================================
           ABDULLAH
        ================================================= */

        const firstProgress =
          ease(

            clamp(
              progress / .23,
              0,
              1
            )

          );


        firstName.style.opacity =
          .03 +
          (
            .97 *
            firstProgress
          );


        firstName.style.filter =
          `blur(${
            18 *
            (
              1 -
              firstProgress
            )
          }px)`;



        /* =================================================
           RAYEES
        ================================================= */

        const lastProgress =
          ease(

            clamp(
              (
                progress -
                .07
              ) /
              .25,

              0,
              1
            )

          );


        lastName.style.opacity =
          lastProgress;


        lastName.style.filter =
          `blur(${
            20 *
            (
              1 -
              lastProgress
            )
          }px)`;



        /* =================================================
           SUBTLE NAME SEPARATION
        ================================================= */

        const separation =
          ease(

            clamp(
              (
                progress -
                .29
              ) /
              .28,

              0,
              1
            )

          );


        const separationDistance =
          mobile
            ? 7
            : 19;


        const firstX =
          -separationDistance *
          separation;


        const lastX =
          separationDistance *
          separation;


        const firstY =
          52 *
          (
            1 -
            firstProgress
          );


        const lastY =
          72 *
          (
            1 -
            lastProgress
          );


        firstName.style.transform =
          `
            translate3d(
              ${firstX}px,
              ${firstY}px,
              0
            )
          `;


        lastName.style.transform =
          `
            translate3d(
              ${lastX}px,
              ${lastY}px,
              0
            )
          `;



        /* =================================================
           CHAMPAGNE -> MIDNIGHT
        ================================================= */

        const darkProgress =
          ease(

            clamp(
              (
                progress -
                .38
              ) /
              .31,

              0,
              1
            )

          );


        midnight.style.opacity =
          darkProgress;


        midnightGlass.style.opacity =
          darkProgress;



        /* =================================================
           TEXT COLOR

           Navy -> Champagne
        ================================================= */

        const start = {
          r: 7,
          g: 25,
          b: 43
        };


        const end = {
          r: 238,
          g: 229,
          b: 213
        };


        const red =
          Math.round(
            mix(
              start.r,
              end.r,
              darkProgress
            )
          );


        const green =
          Math.round(
            mix(
              start.g,
              end.g,
              darkProgress
            )
          );


        const blue =
          Math.round(
            mix(
              start.b,
              end.b,
              darkProgress
            )
          );


        const textColor =
          `rgb(
            ${red},
            ${green},
            ${blue}
          )`;


        firstName.style.color =
          textColor;


        lastName.style.color =
          textColor;



        /* =================================================
           LOGO COLOR

           Uses the exact same transition as the typography.
        ================================================= */

        brandMark.style.setProperty(
          "--logo-r",
          red
        );


        brandMark.style.setProperty(
          "--logo-g",
          green
        );


        brandMark.style.setProperty(
          "--logo-b",
          blue
        );



        /* =================================================
           GOLD REFLECTION
        ================================================= */

        const reflection =
          clamp(

            1 -
            (
              Math.abs(
                progress -
                .63
              ) /
              .15
            ),

            0,
            1

          );


        goldSweep.style.opacity =
          reflection * .82;


        goldLine.style.opacity =
          reflection * .88;


        const sweepPosition =
          -20 +
          (
            progress *
            40
          );


        const sweepTransform =
          `
            rotate(-9deg)

            translate3d(
              ${sweepPosition}%,
              0,
              0
            )
          `;


        goldSweep.style.transform =
          sweepTransform;


        goldLine.style.transform =
          sweepTransform;



        /* =================================================
           NAME SETTLE

           Maximum zoom is only 1.5%.
        ================================================= */

        const settle =
          ease(

            clamp(
              (
                progress -
                .63
              ) /
              .37,

              0,
              1
            )

          );


        name.style.transform =
          `
            translate3d(
              0,
              ${-8 * settle}px,
              0
            )

            scale(
              ${
                1 +
                (
                  .015 *
                  settle
                )
              }
            )
          `;



        /* =================================================
           SOCIAL REVEAL
        ================================================= */

        if (
          progress >
          .72
        ) {

          socials.classList.add(
            "visible"
          );

        }

        else {

          socials.classList.remove(
            "visible"
          );

        }



        /* =================================================
           MOBILE BROWSER CHROME
        ================================================= */

        if (
          darkProgress >
          .55
        ) {

          themeColor.setAttribute(
            "content",
            "#07192b"
          );

        }

        else {

          themeColor.setAttribute(
            "content",
            "#eee6d8"
          );

        }

      }



      /* =====================================================
         RAF
      ====================================================== */

      function requestRender() {

        if (!ticking) {

          ticking = true;

          requestAnimationFrame(
            render
          );

        }

      }



      window.addEventListener(
        "scroll",
        requestRender,
        {
          passive: true
        }
      );


      window.addEventListener(
        "resize",
        requestRender
      );


      window.addEventListener(
        "orientationchange",
        requestRender
      );


      brandMark.addEventListener(
        "click",
        event => {

          event.preventDefault();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );


      requestRender();

    })();

  </script>


</body>
</html>
