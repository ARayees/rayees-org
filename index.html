<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#e8ddca">

  <title>Abdullah Rayees</title>

  <style>

    :root {
      --champagne: #e8ddca;
      --ivory: #f6f2ea;
      --navy: #07192b;
      --midnight: #102c46;
      --gold: #b89558;
      --pale-gold: #d8c39a;
    }


    * {
      box-sizing: border-box;
    }


    html {
      margin: 0;
      padding: 0;

      width: 100%;

      background: var(--champagne);

      -webkit-text-size-adjust: 100%;
    }


    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      overflow-x: hidden;

      color: var(--navy);

      background: var(--champagne);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;

      overscroll-behavior-x: none;
    }



    /* ========================================
       FIXED BACKGROUND
    ======================================== */

    .world {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: -10;

      overflow: hidden;

      pointer-events: none;

      background:
        linear-gradient(
          145deg,
          #f8f5ed 0%,
          #e8ddca 55%,
          #ddd0b9 100%
        );

      transform:
        translateZ(0);
    }


    .navy-layer {
      position: absolute;

      inset: -10%;

      opacity: 0;

      background:
        radial-gradient(
          circle at 28% 18%,
          #183c59 0%,
          #0d2941 31%,
          #07192b 72%
        );

      will-change:
        opacity;
    }



    /* ========================================
       COLOR LIGHT
    ======================================== */

    .glow {
      position: absolute;

      border-radius: 50%;

      filter:
        blur(85px);

      opacity: .32;

      will-change:
        transform;
    }


    .blue-glow {
      width: 700px;
      height: 560px;

      left: -280px;
      top: -120px;

      background:
        rgba(51, 103, 145, .44);

      animation:
        blueAmbient
        21s
        ease-in-out
        infinite alternate;
    }


    .gold-glow {
      width: 650px;
      height: 520px;

      right: -280px;
      top: 30%;

      background:
        rgba(190, 153, 87, .32);

      animation:
        goldAmbient
        25s
        ease-in-out
        infinite alternate;
    }


    .champagne-glow {
      width: 650px;
      height: 500px;

      left: 22%;
      bottom: -230px;

      background:
        rgba(224, 204, 164, .32);

      animation:
        champagneAmbient
        28s
        ease-in-out
        infinite alternate;
    }



    /* ========================================
       LIQUID GLASS
    ======================================== */

    .glass {
      position: absolute;

      border:
        1px solid
        rgba(255,255,255,.30);

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.18),
          rgba(255,255,255,.025)
        );

      box-shadow:

        inset 30px 25px 80px
        rgba(255,255,255,.16),

        inset -35px -35px 100px
        rgba(7,25,43,.09),

        0 40px 100px
        rgba(20,30,45,.06);

      -webkit-backdrop-filter:
        blur(18px)
        saturate(120%);

      backdrop-filter:
        blur(18px)
        saturate(120%);

      will-change:
        transform,
        border-radius;
    }


    .glass-one {
      width: 620px;
      height: 620px;

      left: -310px;
      top: 18%;

      border-radius:
        58% 42% 62% 38% /
        45% 61% 39% 55%;

      animation:
        glassOneAmbient
        24s
        ease-in-out
        infinite alternate;
    }


    .glass-two {
      width: 720px;
      height: 720px;

      right: -360px;
      top: 47%;

      border-radius:
        39% 61% 46% 54% /
        62% 38% 60% 40%;

      animation:
        glassTwoAmbient
        29s
        ease-in-out
        infinite alternate;
    }



    /* ========================================
       GOLD LIGHT SWEEP
    ======================================== */

    .gold-sweep {
      position: absolute;

      width: 150%;
      height: 180px;

      left: -25%;
      top: 48%;

      opacity: 0;

      transform:
        rotate(-10deg)
        translate3d(-20%,0,0);

      background:
        linear-gradient(
          90deg,
          transparent 0%,
          transparent 30%,
          rgba(216,195,154,.04) 40%,
          rgba(216,195,154,.32) 50%,
          rgba(184,149,88,.10) 60%,
          transparent 72%
        );

      filter:
        blur(32px);

      will-change:
        transform,
        opacity;
    }


    .gold-line {
      position: absolute;

      width: 150%;
      height: 1px;

      left: -25%;
      top: 50%;

      opacity: 0;

      transform:
        rotate(-10deg)
        translate3d(-20%,0,0);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(216,195,154,.10),
          rgba(216,195,154,.85),
          rgba(184,149,88,.30),
          transparent
        );

      box-shadow:
        0 0 24px
        rgba(216,195,154,.25);

      will-change:
        transform,
        opacity;
    }



    /* ========================================
       TEXTURE
    ======================================== */

    .grain {
      position: absolute;

      inset: 0;

      opacity: .045;

      background-image:
        radial-gradient(
          rgba(20,20,22,.28)
          .4px,
          transparent .5px
        );

      background-size:
        5px 5px;
    }



    /* ========================================
       SCROLL AREA
    ======================================== */

    .story {
      position: relative;

      height: 300vh;
      height: 300svh;
    }


    .stage {
      position: sticky;

      top: 0;

      width: 100%;

      height: 100vh;
      height: 100svh;

      min-height: 520px;

      overflow: hidden;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(100px, calc(env(safe-area-inset-bottom) + 80px));
    }



    /* ========================================
       NAME
    ======================================== */

    .name {
      position: relative;

      z-index: 10;

      width: 100%;

      text-align: center;

      transform:
        translate3d(0,0,0);

      will-change:
        transform;
    }


    h1 {
      margin: 0 auto;

      width: 100%;

      padding:
        .12em
        .15em
        .28em;

      font-family:
        "Iowan Old Style",
        "Baskerville",
        "Baskerville Old Face",
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(
          70px,
          11vw,
          156px
        );

      line-height:
        1;

      letter-spacing:
        -.055em;

      font-weight:
        400;
    }


    h1 span {
      display: block;

      will-change:
        transform,
        opacity,
        filter;
    }


    .first-name {
      opacity: .03;

      filter:
        blur(18px);

      transform:
        translate3d(
          0,
          50px,
          0
        );
    }


    .last-name {
      opacity: 0;

      filter:
        blur(20px);

      transform:
        translate3d(
          0,
          70px,
          0
        );
    }



    /* ========================================
       SOCIALS
    ======================================== */

    .socials {
      position: fixed;

      z-index: 100;

      left: 50%;

      bottom:
        max(
          20px,
          calc(env(safe-area-inset-bottom) + 12px)
        );

      display: flex;

      align-items: center;

      gap: 13px;

      opacity: 0;

      pointer-events: none;

      transform:
        translate3d(
          -50%,
          24px,
          0
        );

      transition:
        opacity .7s
        cubic-bezier(.16,1,.3,1),

        transform .7s
        cubic-bezier(.16,1,.3,1);
    }


    .socials.visible {
      opacity: 1;

      pointer-events: auto;

      transform:
        translate3d(
          -50%,
          0,
          0
        );
    }


    .social {
      width: 50px;
      height: 50px;

      display: grid;

      place-items: center;

      flex: 0 0 auto;

      border-radius: 50%;

      color:
        var(--navy);

      text-decoration: none;

      -webkit-tap-highlight-color:
        transparent;

      border:
        1px solid
        rgba(255,255,255,.58);

      background:
        rgba(246,242,234,.44);

      box-shadow:

        inset 0 1px 0
        rgba(255,255,255,.8),

        0 10px 30px
        rgba(0,0,0,.10);

      -webkit-backdrop-filter:
        blur(18px)
        saturate(125%);

      backdrop-filter:
        blur(18px)
        saturate(125%);
    }


    .social svg {
      width: 21px;
      height: 21px;

      fill:
        currentColor;
    }


    .instagram {
      animation:
        socialOne
        6.5s
        ease-in-out
        infinite alternate;
    }


    .linkedin {
      animation:
        socialTwo
        7.5s
        ease-in-out
        infinite alternate;
    }


    .social.dark {
      color:
        var(--ivory);

      border-color:
        rgba(216,195,154,.28);

      background:
        rgba(255,255,255,.075);
    }



    /* ========================================
       DESKTOP AMBIENT ANIMATIONS
    ======================================== */

    @keyframes blueAmbient {

      from {
        transform:
          translate3d(0,0,0)
          scale(1);
      }

      to {
        transform:
          translate3d(190px,130px,0)
          scale(1.12,.90);
      }

    }


    @keyframes goldAmbient {

      from {
        transform:
          translate3d(0,0,0);
      }

      to {
        transform:
          translate3d(-180px,110px,0)
          scale(.92,1.12);
      }

    }


    @keyframes champagneAmbient {

      from {
        transform:
          translate3d(0,0,0);
      }

      to {
        transform:
          translate3d(100px,-150px,0)
          scale(1.12,.92);
      }

    }


    @keyframes glassOneAmbient {

      from {

        transform:
          translate3d(0,0,0)
          rotate(-6deg);

      }

      to {

        transform:
          translate3d(170px,90px,0)
          rotate(18deg)
          scale(1.12,.9);

        border-radius:
          40% 60% 48% 52% /
          62% 38% 58% 42%;

      }

    }


    @keyframes glassTwoAmbient {

      from {

        transform:
          translate3d(0,0,0)
          rotate(5deg);

      }

      to {

        transform:
          translate3d(-180px,-80px,0)
          rotate(-17deg)
          scale(.92,1.10);

        border-radius:
          62% 38% 56% 44% /
          42% 60% 40% 58%;

      }

    }


    @keyframes socialOne {

      from {
        transform:
          translate3d(0,3px,0)
          rotate(-1deg);
      }

      to {
        transform:
          translate3d(0,-5px,0)
          rotate(.8deg);
      }

    }


    @keyframes socialTwo {

      from {
        transform:
          translate3d(0,-3px,0)
          rotate(.7deg);
      }

      to {
        transform:
          translate3d(0,4px,0)
          rotate(-.8deg);
      }

    }



    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 700px) {

      /*
       Shorter scroll journey on phones.
      */

      .story {
        height: 250vh;
        height: 250svh;
      }


      .stage {
        height: 100vh;
        height: 100svh;

        min-height: 480px;

        padding-left: 12px;
        padding-right: 12px;

        padding-bottom:
          max(
            90px,
            calc(
              env(safe-area-inset-bottom)
              + 72px
            )
          );
      }


      h1 {
        max-width: 100%;

        font-size:
          clamp(
            54px,
            18.5vw,
            92px
          );

        line-height:
          1.02;

        letter-spacing:
          -.05em;

        padding-left:
          .06em;

        padding-right:
          .06em;

        padding-bottom:
          .30em;
      }


      /*
       Reduce blur complexity on mobile Safari.
      */

      .glow {
        filter:
          blur(65px);
      }


      .blue-glow {
        width: 430px;
        height: 400px;

        left: -260px;
        top: -70px;
      }


      .gold-glow {
        width: 420px;
        height: 380px;

        right: -270px;
        top: 33%;
      }


      .champagne-glow {
        width: 420px;
        height: 380px;

        left: 10%;
        bottom: -180px;
      }


      /*
       Smaller glass elements = substantially
       better Safari performance.
      */

      .glass {
        -webkit-backdrop-filter:
          blur(10px);

        backdrop-filter:
          blur(10px);
      }


      .glass-one {
        width: 350px;
        height: 350px;

        left: -230px;
        top: 18%;
      }


      .glass-two {
        width: 410px;
        height: 410px;

        right: -280px;
        top: 53%;
      }


      .gold-sweep {
        width: 190%;
        left: -45%;

        height: 130px;

        filter:
          blur(25px);
      }


      .gold-line {
        width: 190%;
        left: -45%;
      }


      .social {
        width: 48px;
        height: 48px;
      }


      .social svg {
        width: 20px;
        height: 20px;
      }

    }



    /* ========================================
       VERY SMALL PHONES
    ======================================== */

    @media (max-width: 380px) {

      h1 {
        font-size:
          clamp(
            50px,
            17.5vw,
            68px
          );

        letter-spacing:
          -.045em;
      }


      .social {
        width: 46px;
        height: 46px;
      }

    }



    /* ========================================
       LANDSCAPE PHONE
    ======================================== */

    @media
    (max-height: 500px)
    and
    (orientation: landscape) {

      .stage {
        min-height: 100vh;

        padding-top:
          20px;

        padding-bottom:
          60px;
      }


      h1 {
        font-size:
          clamp(
            48px,
            11vw,
            76px
          );

        line-height:
          .92;
      }


      .socials {
        bottom:
          10px;
      }


      .social {
        width:
          42px;

        height:
          42px;
      }

    }



    /* ========================================
       REDUCED MOTION
    ======================================== */

    @media
    (prefers-reduced-motion: reduce) {

      .glow,
      .glass,
      .social {
        animation:
          none !important;
      }


      .first-name,
      .last-name {
        opacity:
          1 !important;

        filter:
          none !important;

        transform:
          none !important;
      }

    }

  </style>
</head>


<body>


  <!-- BACKGROUND -->

  <div class="world">

    <div
      class="navy-layer"
      id="navyLayer"
    ></div>


    <div
      class="glow blue-glow"
      id="blueGlow"
    ></div>


    <div
      class="glow gold-glow"
      id="goldGlow"
    ></div>


    <div
      class="glow champagne-glow"
      id="champagneGlow"
    ></div>


    <div
      class="glass glass-one"
      id="glassOne"
    ></div>


    <div
      class="glass glass-two"
      id="glassTwo"
    ></div>


    <div
      class="gold-sweep"
      id="goldSweep"
    ></div>


    <div
      class="gold-line"
      id="goldLine"
    ></div>


    <div class="grain"></div>

  </div>



  <!-- SCROLL STORY -->

  <section
    class="story"
    id="story"
  >

    <div class="stage">

      <div
        class="name"
        id="name"
      >

        <h1>

          <span
            class="first-name"
            id="firstName"
          >
            Abdullah
          </span>


          <span
            class="last-name"
            id="lastName"
          >
            Rayees.
          </span>

        </h1>

      </div>

    </div>

  </section>



  <!-- FLOATING SOCIALS -->

  <div
    class="socials"
    id="socials"
    aria-label="Social profiles"
  >


    <!-- INSTAGRAM -->

    <a
      class="social instagram"
      id="instagram"
      href="https://www.instagram.com/aaabdxllah/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <path
          d="M7.75 2h8.5A5.76 5.76 0 0 1 22 7.75v8.5A5.76 5.76 0 0 1 16.25 22h-8.5A5.76 5.76 0 0 1 2 16.25v-8.5A5.76 5.76 0 0 1 7.75 2Zm0 2A3.75 3.75 0 0 0 4 7.75v8.5A3.75 3.75 0 0 0 7.75 20h8.5A3.75 3.75 0 0 0 20 16.25v-8.5A3.75 3.75 0 0 0 16.25 4h-8.5ZM17.5 5.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"
        />

      </svg>

    </a>



    <!-- LINKEDIN -->

    <a
      class="social linkedin"
      id="linkedin"
      href="https://www.linkedin.com/in/arayees/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="LinkedIn"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <path
          d="M5.34 3.5A2.34 2.34 0 1 1 5.34 8.18 2.34 2.34 0 0 1 5.34 3.5ZM3.32 9.75h4.04V21H3.32V9.75Zm6.55 0h3.87v1.54h.05c.54-1.02 1.86-2.1 3.83-2.1 4.1 0 4.86 2.7 4.86 6.21V21h-4.03v-4.96c0-1.18-.02-2.71-1.65-2.71-1.66 0-1.91 1.29-1.91 2.62V21h-4.02V9.75Z"
        />

      </svg>

    </a>

  </div>



  <script>

    const story =
      document.getElementById("story");

    const name =
      document.getElementById("name");

    const firstName =
      document.getElementById("firstName");

    const lastName =
      document.getElementById("lastName");

    const socials =
      document.getElementById("socials");

    const instagram =
      document.getElementById("instagram");

    const linkedin =
      document.getElementById("linkedin");

    const navyLayer =
      document.getElementById("navyLayer");

    const blueGlow =
      document.getElementById("blueGlow");

    const goldGlow =
      document.getElementById("goldGlow");

    const champagneGlow =
      document.getElementById(
        "champagneGlow"
      );

    const glassOne =
      document.getElementById("glassOne");

    const glassTwo =
      document.getElementById("glassTwo");

    const goldSweep =
      document.getElementById("goldSweep");

    const goldLine =
      document.getElementById("goldLine");


    let ticking = false;



    function clamp(
      value,
      min,
      max
    ) {

      return Math.min(
        Math.max(
          value,
          min
        ),
        max
      );

    }



    function ease(t) {

      return (
        1 -
        Math.pow(
          1 - t,
          3
        )
      );

    }



    function render() {

      ticking = false;


      const rect =
        story.getBoundingClientRect();


      const viewportHeight =
        window.innerHeight;


      const distance =
        Math.max(
          1,
          story.offsetHeight -
          viewportHeight
        );


      const progress =
        clamp(
          -rect.top / distance,
          0,
          1
        );



      /* =================================
         ABDULLAH
      ================================= */

      const first =
        ease(

          clamp(
            progress / .27,
            0,
            1
          )

        );


      firstName.style.opacity =
        .03 +
        (.97 * first);


      firstName.style.filter =
        `blur(${18 * (1 - first)}px)`;


      const firstY =
        50 *
        (1 - first);



      /* =================================
         RAYEES
      ================================= */

      const last =
        ease(

          clamp(
            (progress - .08) /
            .29,

            0,
            1
          )

        );


      lastName.style.opacity =
        last;


      lastName.style.filter =
        `blur(${20 * (1 - last)}px)`;


      const lastY =
        70 *
        (1 - last);



      /* =================================
         TEXT SEPARATION
      ================================= */

      const separate =
        ease(

          clamp(
            (progress - .34) /
            .32,

            0,
            1
          )

        );


      /*
       Smaller separation on phones.
      */

      const mobile =
        window.innerWidth <= 700;


      const separationAmount =
        mobile
          ? 8
          : 20;


      firstName.style.transform =
        `
          translate3d(
            ${-separationAmount * separate}px,
            ${firstY}px,
            0
          )
        `;


      lastName.style.transform =
        `
          translate3d(
            ${separationAmount * separate}px,
            ${lastY}px,
            0
          )
        `;



      /* =================================
         NAVY TRANSITION
      ================================= */

      const dark =
        ease(

          clamp(
            (progress - .38) /
            .34,

            0,
            1
          )

        );


      navyLayer.style.opacity =
        dark;



      /* =================================
         TEXT COLOR

         Navy -> warm ivory
      ================================= */

      const start =
        {
          r: 7,
          g: 25,
          b: 43
        };


      const end =
        {
          r: 236,
          g: 226,
          b: 207
        };


      const r =
        Math.round(
          start.r +
          (
            end.r -
            start.r
          ) * dark
        );


      const g =
        Math.round(
          start.g +
          (
            end.g -
            start.g
          ) * dark
        );


      const b =
        Math.round(
          start.b +
          (
            end.b -
            start.b
          ) * dark
        );


      const textColor =
        `rgb(${r},${g},${b})`;


      firstName.style.color =
        textColor;


      lastName.style.color =
        textColor;



      /* =================================
         GOLD REFLECTION
      ================================= */

      const reflection =
        clamp(
          1 -
          Math.abs(
            progress - .65
          ) / .17,

          0,
          1
        );


      goldLine.style.opacity =
        reflection * .75;


      goldSweep.style.opacity =
        reflection * .72;


      const sweepX =
        -25 +
        (progress * 45);


      goldLine.style.transform =
        `
          rotate(-10deg)
          translate3d(
            ${sweepX}%,
            0,
            0
          )
        `;


      goldSweep.style.transform =
        `
          rotate(-10deg)
          translate3d(
            ${sweepX}%,
            0,
            0
          )
        `;



      /* =================================
         NAME SETTLE

         Maximum scale = 2%.
      ================================= */

      const settle =
        ease(

          clamp(
            (progress - .65) /
            .35,

            0,
            1
          )

        );


      name.style.transform =
        `
          translate3d(
            0,
            ${-10 * settle}px,
            0
          )

          scale(
            ${1 + (.02 * settle)}
          )
        `;



      /* =================================
         SOCIALS
      ================================= */

      if (
        progress >
        .69
      ) {

        socials.classList.add(
          "visible"
        );

      }

      else {

        socials.classList.remove(
          "visible"
        );

      }


      if (
        dark >
        .55
      ) {

        instagram.classList.add(
          "dark"
        );

        linkedin.classList.add(
          "dark"
        );

      }

      else {

        instagram.classList.remove(
          "dark"
        );

        linkedin.classList.remove(
          "dark"
        );

      }



      /* =================================
         SCROLL PARALLAX

         transform is used instead of
         CSS translate for Safari.
      ================================= */

      const mobileFactor =
        mobile
          ? .45
          : 1;


      blueGlow.style.transform =
        `
          translate3d(
            ${progress * 70 * mobileFactor}px,
            ${progress * 40 * mobileFactor}px,
            0
          )
        `;


      goldGlow.style.transform =
        `
          translate3d(
            ${progress * -80 * mobileFactor}px,
            ${progress * 40 * mobileFactor}px,
            0
          )
        `;


      champagneGlow.style.transform =
        `
          translate3d(
            ${progress * 40 * mobileFactor}px,
            ${progress * -70 * mobileFactor}px,
            0
          )
        `;


      /*
       We intentionally do not overwrite
       the animated transform of the glass
       shapes here.

       This fixes the animation conflict
       from the previous version.
      */

    }



    function requestRender() {

      if (!ticking) {

        ticking = true;

        requestAnimationFrame(
          render
        );

      }

    }



    window.addEventListener(
      "scroll",
      requestRender,
      {
        passive: true
      }
    );


    window.addEventListener(
      "resize",
      requestRender
    );


    window.addEventListener(
      "orientationchange",
      requestRender
    );


    requestRender();

  </script>


</body>
</html>
